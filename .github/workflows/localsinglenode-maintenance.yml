name: LocalSingleNode maintenance
run-name: "LocalSingleNode maintenance @ ${{ github.sha }}"
on:
  workflow_dispatch:
    inputs:
      app_instance:
        description: Select the primary app or the protected additional app
        required: true
        default: primary
        type: choice
        options:
          - primary
          - additional
      restart_app:
        description: Restart only this app's web container and verify public catalog persistence; requires acceptance_only=true
        type: boolean
        default: false
      backup_now:
        description: Create and verify a protected backup
        type: boolean
        default: true
      reboot_check:
        description: Reboot 30 seconds after the entire successful run finishes
        type: boolean
        default: false
      acceptance_only:
        description: Run only HTTP acceptance and report uptime
        type: boolean
        default: false
      restart_connector:
        description: Restart this app's public connector and verify recovery; requires acceptance_only=true
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"
    - cron: "27 3 * * *"
permissions:
  contents: read
  actions: read
jobs:
  maintenance:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: localsinglenode-maintenance
      cancel-in-progress: false
    runs-on: [self-hosted, linux, x64, "${{ vars.LOCALSINGLENODE_RUNNER_LABEL || 'localsinglenode-books' }}"]
    timeout-minutes: 30
    environment:
      name: ${{ inputs.app_instance == 'additional' && vars.LOCALSINGLENODE_ADDITIONAL_ENVIRONMENT || vars.LOCALSINGLENODE_ENVIRONMENT || 'localsinglenode' }}
    steps:
      - name: Require this deployment target to be enabled
        env:
          DEPLOY_TARGETS: ${{ vars.DEPLOY_TARGETS }}
          TARGET: localsinglenode
        run: |
          targets=",${DEPLOY_TARGETS// /},"
          if [[ "$targets" != *",${TARGET},"* ]]; then
            echo "::error::Deployment target '${TARGET}' is not enabled. Add it to the DEPLOY_TARGETS repository variable (Settings > Secrets and variables > Actions > Variables), for example 'localcluster,localsinglenode'."
            exit 1
          fi

      - name: Verify the intended native node
        env:
          LOCALSINGLENODE_HOST: ${{ vars.LOCALSINGLENODE_HOST }}
        run: |
          test -n "$LOCALSINGLENODE_HOST"
          test "$(hostname)" = "$LOCALSINGLENODE_HOST"
          test "$(uname -s)" = Linux
          case "$(uname -r)" in *[Mm]icrosoft*) exit 1 ;; esac

      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Validate connector restart selection
        env:
          ACCEPTANCE_ONLY: ${{ inputs.acceptance_only }}
          RESTART_CONNECTOR: ${{ inputs.restart_connector }}
          RESTART_APP: ${{ inputs.restart_app }}
          REBOOT_CHECK: ${{ inputs.reboot_check }}
          APP_INSTANCE: ${{ inputs.app_instance || 'primary' }}
        run: |
          if [[ ( "$RESTART_CONNECTOR" == true || "$RESTART_APP" == true ) && "$ACCEPTANCE_ONLY" != true ]]; then
            echo "Restart checks require acceptance_only=true so backups and maintenance are skipped." >&2
            exit 1
          fi
          if [[ "$RESTART_CONNECTOR" == true && "$RESTART_APP" == true ]]; then
            echo "Select only one restart check per run." >&2
            exit 1
          fi
          if [[ "$APP_INSTANCE" == additional && "$REBOOT_CHECK" == true ]]; then
            echo "Additional-app maintenance cannot request a shared host reboot." >&2
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require green main CI for unchanged operation code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 Deployment/Common/Scripts/verify-operation-source.py > "$RUNNER_TEMP/maintenance-ci.json"
      - name: Resolve protected application instance
        env:
          INPUT_APP_INSTANCE: ${{ inputs.app_instance || 'primary' }}
          APP_INSTANCE_CONFIG: ${{ secrets.LOCALSINGLENODE_APP_INSTANCE }}
          ADDITIONAL_INSTANCE_ENVIRONMENT: ${{ vars.LOCALSINGLENODE_ADDITIONAL_ENVIRONMENT }}
          PRIMARY_INSTANCE_ENVIRONMENT: ${{ vars.LOCALSINGLENODE_ENVIRONMENT }}
        run: |
          set -euo pipefail
          FRONTEND_PROFILE="$(python3 Scripts/Frontend/resolve_frontend_profile.py)"
          ACCEPTANCE_PROFILE="$(python3 Scripts/Frontend/resolve_frontend_profile.py --acceptance-profile)"
          export FRONTEND_PROFILE ACCEPTANCE_PROFILE
          python3 Deployment/LocalSingleNode/Scripts/resolve-app-instance.py
      - name: Protected backup and scoped maintenance
        if: inputs.acceptance_only != true
        env:
          BACKUP_NOW: ${{ inputs.backup_now }}
        run: |
          args=()
          if [[ "$BACKUP_NOW" == true ]]; then args+=(--backup-now); fi
          bash Deployment/LocalSingleNode/Scripts/run-maintenance.sh "${args[@]}"
      - name: Prove public connector restart recovery
        if: inputs.restart_connector == true
        run: bash Deployment/LocalSingleNode/Scripts/restart-public-connector-check.sh
      - name: Prove scoped app restart and catalog persistence
        if: inputs.restart_app == true
        run: |
          bash Deployment/Common/Scripts/with-deploy-lock.sh \
            python3 Deployment/LocalSingleNode/Scripts/restart-app-check.py
      - name: Read-only native doctor
        run: bash Deployment/LocalSingleNode/Scripts/doctor.sh --json
      - name: Run HTTP acceptance and report uptime
        run: |
          bash Deployment/LocalSingleNode/Scripts/acceptance-check.sh
          uptime -s
          awk '{printf "Uptime seconds: %.0f\n", $1}' /proc/uptime
      - name: Schedule completion-aware reboot check
        if: inputs.reboot_check == true && inputs.acceptance_only != true
        env:
          EXPECTED_NODE: ${{ vars.LOCALSINGLENODE_HOST }}
        run: |
          INSTALL_USER="$(python3 - <<'PY'
          import sys
          sys.path.insert(0, 'Deployment/LocalSingleNode/Scripts/lib')
          from ls_settings import read_yaml, ETC
          print(read_yaml(ETC / 'localsinglenode/machine.yml', node=True)['install_user'])
          PY
          )"
          sudo -n systemd-run --unit="localsinglenode-reboot-$GITHUB_RUN_ID"             --on-active=5s /usr/local/lib/localsinglenode/wait-for-successful-run-reboot.sh             "$INSTALL_USER" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$EXPECTED_NODE"
      - name: Remove temporary app configuration
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/instance-settings.yml" "$RUNNER_TEMP/instance-vars.json" \
            "$RUNNER_TEMP/maintenance-ci.json"

  prune-release-artifacts:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *' || github.event.schedule == '27 3 * * *'
    concurrency:
      group: template-artifact-retention
      cancel-in-progress: false
    runs-on: [self-hosted, linux, x64, "${{ vars.LOCALSINGLENODE_RUNNER_LABEL || 'localsinglenode-books' }}"]
    timeout-minutes: 20
    environment:
      name: ${{ (github.event.schedule == '27 3 * * *' || inputs.app_instance == 'additional') && vars.LOCALSINGLENODE_ADDITIONAL_ENVIRONMENT || vars.LOCALSINGLENODE_ENVIRONMENT || 'localsinglenode' }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Require this deployment target to be enabled
        env:
          DEPLOY_TARGETS: ${{ vars.DEPLOY_TARGETS }}
          TARGET: localsinglenode
        run: |
          targets=",${DEPLOY_TARGETS// /},"
          if [[ "$targets" != *",${TARGET},"* ]]; then
            echo "::error::Deployment target '${TARGET}' is not enabled. Add it to the DEPLOY_TARGETS repository variable."
            exit 1
          fi

      - name: Verify the intended native node
        env:
          LOCALSINGLENODE_HOST: ${{ vars.LOCALSINGLENODE_HOST }}
        run: |
          test -n "$LOCALSINGLENODE_HOST"
          test "$(hostname)" = "$LOCALSINGLENODE_HOST"
          test "$(uname -s)" = Linux
          case "$(uname -r)" in *[Mm]icrosoft*) exit 1 ;; esac

      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require green main CI for unchanged operation code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 Deployment/Common/Scripts/verify-operation-source.py > /dev/null

      - name: Prune local CI reports under the shared deployment lock
        env:
          LOCALCLUSTER_DEPLOY_LOCK_TIMEOUT_SECONDS: "300"
        run: bash Deployment/Common/Scripts/with-deploy-lock.sh python3 Scripts/CI/ci_report_store.py prune --repository "$GITHUB_REPOSITORY"

      - name: Check whether the optional additional app exists
        id: instance
        env:
          APP_INSTANCE: ${{ github.event.schedule == '27 3 * * *' && 'additional' || inputs.app_instance || 'primary' }}
          APP_INSTANCE_CONFIG: ${{ secrets.LOCALSINGLENODE_APP_INSTANCE }}
        run: |
          if [[ "$APP_INSTANCE" == additional && -z "$APP_INSTANCE_CONFIG" ]]; then
            echo "::notice::No protected additional-app configuration is present; no additional-app artifact was selected."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve protected application instance
        if: steps.instance.outputs.configured == 'true'
        env:
          INPUT_APP_INSTANCE: ${{ github.event.schedule == '27 3 * * *' && 'additional' || inputs.app_instance || 'primary' }}
          APP_INSTANCE_CONFIG: ${{ secrets.LOCALSINGLENODE_APP_INSTANCE }}
          ADDITIONAL_INSTANCE_ENVIRONMENT: ${{ vars.LOCALSINGLENODE_ADDITIONAL_ENVIRONMENT }}
          PRIMARY_INSTANCE_ENVIRONMENT: ${{ vars.LOCALSINGLENODE_ENVIRONMENT }}
        run: |
          set -euo pipefail
          FRONTEND_PROFILE="$(python3 Scripts/Frontend/resolve_frontend_profile.py)"
          ACCEPTANCE_PROFILE="$(python3 Scripts/Frontend/resolve_frontend_profile.py --acceptance-profile)"
          export FRONTEND_PROFILE ACCEPTANCE_PROFILE
          python3 Deployment/LocalSingleNode/Scripts/resolve-app-instance.py

      - name: Prune old release artifacts under the shared deployment lock
        if: steps.instance.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCALCLUSTER_DEPLOY_LOCK_TIMEOUT_SECONDS: "300"
          ACTIONS_ARTIFACT_RETENTION_ENABLED: ${{ vars.ACTIONS_ARTIFACT_RETENTION_ENABLED || 'false' }}
        run: bash Deployment/Common/Scripts/with-deploy-lock.sh bash Deployment/LocalSingleNode/Scripts/prune-release-artifacts.sh

      - name: Remove temporary app configuration
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/instance-settings.yml" "$RUNNER_TEMP/instance-vars.json"
