name: CD - Deploy LocalCluster
run-name: "CD LocalCluster @ ${{ inputs.target_sha || github.sha }} request=${{ inputs.request_id || 'manual' }}"

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Run the EF migration bundle before starting app servers
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      target_sha:
        description: Commit on main to deploy (full SHA). Empty deploys the dispatched main commit.
        required: false
        default: ""
        type: string
      local_payload_pin_key:
        description: Optional exact local recovery pin key for this target SHA. Leave empty to select the successful CI release.
        required: false
        default: ""
        type: string
      workflow_sha:
        description: Exact trusted main workflow SHA frozen by the release coordinator.
        required: false
        default: ""
        type: string
      refresh_rating_ranks:
        description: Refresh rating ranks during deployment; LocalCluster does not support this effect.
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      ci_run_id:
        description: Exact successful CI run ID frozen by the release coordinator.
        required: false
        default: ""
        type: string
      ci_run_attempt:
        description: Exact successful CI run attempt frozen by the release coordinator.
        required: false
        default: ""
        type: string
      payload_transport:
        description: Exact immutable release payload transport frozen by the release coordinator.
        required: false
        default: ""
        type: string
      payload_image:
        description: Exact release payload image when the transport is GHCR.
        required: false
        default: ""
        type: string
      payload_digest:
        description: Exact release payload digest when the transport is GHCR.
        required: false
        default: ""
        type: string
      artifact_id:
        description: Exact Actions artifact ID when the transport is an Actions artifact.
        required: false
        default: ""
        type: string
      artifact_digest:
        description: Exact Actions artifact digest when the transport is an Actions artifact.
        required: false
        default: ""
        type: string
      manifest_sha256:
        description: Exact release manifest SHA-256 frozen by the release coordinator.
        required: false
        default: ""
        type: string
      image_digest:
        description: Exact application image digest frozen by the release coordinator.
        required: false
        default: ""
        type: string
      operation_id:
        description: Release coordinator operation ID for run correlation.
        required: false
        default: ""
        type: string
      request_id:
        description: Release coordinator request ID used to correlate this dispatch.
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: template-registry-payloads
  queue: max
  cancel-in-progress: false

jobs:
  registry_coordination:
    runs-on: [self-hosted, linux, x64, "${{ vars.LOCALSINGLENODE_RUNNER_LABEL || 'localsinglenode-books' }}"]
    timeout-minutes: 10
    environment:
      name: ${{ vars.LOCALSINGLENODE_ENVIRONMENT || 'localsinglenode' }}
    permissions:
      contents: read
    steps:
      - name: Require this deployment target to be enabled
        env:
          DEPLOY_TARGETS: ${{ vars.DEPLOY_TARGETS }}
          TARGET: localcluster
        run: |
          targets=",${DEPLOY_TARGETS// /},"
          if [[ "$targets" != *",${TARGET},"* ]]; then
            echo "::error::Deployment target '${TARGET}' is not enabled. Add it to the DEPLOY_TARGETS repository variable (Settings > Secrets and variables > Actions > Variables), for example 'localcluster,localsinglenode'."
            exit 1
          fi

      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Verify the registry coordination host
        env:
          LOCALSINGLENODE_HOST: ${{ vars.LOCALSINGLENODE_HOST }}
        run: |
          test -n "$LOCALSINGLENODE_HOST"
          test "$(hostname)" = "$LOCALSINGLENODE_HOST"
          test "$(uname -s)" = Linux
          case "$(uname -r)" in *[Mm]icrosoft*) exit 1 ;; esac

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require no unresolved GHCR deletion reservation
        env:
          LOCALCLUSTER_DEPLOY_LOCK_TIMEOUT_SECONDS: "300"
        run: |
          bash Deployment/Common/Scripts/with-deploy-lock.sh \
            python3 Deployment/Common/Scripts/registry-retention.py --assert-clear

  deploy:
    needs: registry_coordination
    runs-on: [self-hosted, linux, x64, "${{ vars.LOCALCLUSTER_RUNNER_LABEL || 'localcluster-books' }}"]
    timeout-minutes: 60
    environment:
      name: ${{ vars.LOCALCLUSTER_ENVIRONMENT || 'localcluster' }}

    steps:
      - name: Require this deployment target to be enabled
        env:
          DEPLOY_TARGETS: ${{ vars.DEPLOY_TARGETS }}
          TARGET: localcluster
        run: |
          targets=",${DEPLOY_TARGETS// /},"
          if [[ "$targets" != *",${TARGET},"* ]]; then
            echo "::error::Deployment target '${TARGET}' is not enabled. Add it to the DEPLOY_TARGETS repository variable (Settings > Secrets and variables > Actions > Variables), for example 'localcluster,localsinglenode'."
            exit 1
          fi

      - name: Require main branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "LocalCluster CD must be dispatched from main, got ${GITHUB_REF}." >&2
            exit 1
          fi

      - name: Resolve target commit
        env:
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          TARGET_SHA="${INPUT_TARGET_SHA:-$GITHUB_SHA}"
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_sha must be a full lowercase 40-character commit SHA, got '${TARGET_SHA}'." >&2
            exit 1
          fi
          echo "TARGET_SHA=${TARGET_SHA}" >> "$GITHUB_ENV"

      - name: Isolate registry credentials for this job
        run: |
          docker_config="$(mktemp -d "${RUNNER_TEMP}/cd-docker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")"
          chmod 0700 "$docker_config"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"

      - name: Verify node-main runner
        run: |
          echo "Runner name: ${RUNNER_NAME:-unknown}"
          echo "Host: $(hostname)"
          test "$(hostname)" = "node-main"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only commits already on main can deploy; the workflow code itself always
      # comes from the dispatched main commit.
      - name: Verify target is on main
        run: |
          git cat-file -e "${TARGET_SHA}^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" "$GITHUB_SHA" || {
            echo "target_sha ${TARGET_SHA} is not an ancestor of main ${GITHUB_SHA}." >&2
            exit 1
          }

      - name: Validate coordinator dispatch provenance
        env:
          INPUT_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          INPUT_REFRESH_RATING_RANKS: ${{ inputs.refresh_rating_ranks }}
          INPUT_CI_RUN_ID: ${{ inputs.ci_run_id }}
          INPUT_CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
          INPUT_PAYLOAD_TRANSPORT: ${{ inputs.payload_transport }}
          INPUT_PAYLOAD_IMAGE: ${{ inputs.payload_image }}
          INPUT_PAYLOAD_DIGEST: ${{ inputs.payload_digest }}
          INPUT_ARTIFACT_ID: ${{ inputs.artifact_id }}
          INPUT_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          INPUT_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          INPUT_IMAGE_DIGEST: ${{ inputs.image_digest }}
          INPUT_OPERATION_ID: ${{ inputs.operation_id }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
          INPUT_LOCAL_PAYLOAD_PIN_KEY: ${{ inputs.local_payload_pin_key }}
        run: |
          set -euo pipefail
          if [[ -z "$INPUT_REQUEST_ID" ]]; then
            if [[ -n "$INPUT_WORKFLOW_SHA$INPUT_CI_RUN_ID$INPUT_CI_RUN_ATTEMPT$INPUT_PAYLOAD_TRANSPORT$INPUT_PAYLOAD_IMAGE$INPUT_PAYLOAD_DIGEST$INPUT_ARTIFACT_ID$INPUT_ARTIFACT_DIGEST$INPUT_MANIFEST_SHA256$INPUT_IMAGE_DIGEST$INPUT_OPERATION_ID" ]]; then
              echo "Coordinator dispatch provenance is incomplete: request_id is required." >&2
              exit 1
            fi
            if [[ "$INPUT_REFRESH_RATING_RANKS" == true ]]; then
              echo "LocalCluster does not support refresh_rating_ranks." >&2
              exit 1
            fi
            exit 0
          fi

          [[ "$INPUT_REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "request_id is malformed" >&2; exit 1; }
          [[ "$INPUT_OPERATION_ID" =~ ^[A-Za-z0-9_.-]{1,100}$ ]] || { echo "operation_id is malformed" >&2; exit 1; }
          [[ "$INPUT_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "workflow_sha is malformed" >&2; exit 1; }
          [[ "$INPUT_CI_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || { echo "ci_run_id is malformed" >&2; exit 1; }
          [[ "$INPUT_CI_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "ci_run_attempt is malformed" >&2; exit 1; }
          [[ "$INPUT_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "manifest_sha256 is malformed" >&2; exit 1; }
          [[ "$INPUT_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "image_digest is malformed" >&2; exit 1; }
          [[ "$INPUT_REFRESH_RATING_RANKS" == false ]] || { echo "LocalCluster does not support refresh_rating_ranks." >&2; exit 1; }
          [[ -z "$INPUT_LOCAL_PAYLOAD_PIN_KEY" ]] || { echo "Coordinator dispatch cannot replace frozen provenance with a local pin." >&2; exit 1; }
          git cat-file -e "${INPUT_WORKFLOW_SHA}^{commit}"
          git merge-base --is-ancestor "$INPUT_WORKFLOW_SHA" "$GITHUB_SHA" || {
            echo "workflow_sha ${INPUT_WORKFLOW_SHA} is not an ancestor of the dispatched main commit ${GITHUB_SHA}." >&2
            exit 1
          }
          git merge-base --is-ancestor "$TARGET_SHA" "$INPUT_WORKFLOW_SHA" || {
            echo "target_sha ${TARGET_SHA} is not an ancestor of frozen workflow_sha ${INPUT_WORKFLOW_SHA}." >&2
            exit 1
          }

          case "$INPUT_PAYLOAD_TRANSPORT" in
            actions-artifact)
              [[ "$INPUT_ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]] || { echo "artifact_id is malformed" >&2; exit 1; }
              [[ "$INPUT_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "artifact_digest is malformed" >&2; exit 1; }
              [[ -z "$INPUT_PAYLOAD_IMAGE$INPUT_PAYLOAD_DIGEST" ]] || { echo "Actions artifact dispatch must not include GHCR payload identity." >&2; exit 1; }
              ;;
            ghcr-container)
              [[ "$INPUT_PAYLOAD_IMAGE" =~ ^ghcr\.io/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]] || { echo "payload_image is malformed" >&2; exit 1; }
              [[ "$INPUT_PAYLOAD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "payload_digest is malformed" >&2; exit 1; }
              ;;
            *)
              echo "payload_transport is unsupported: ${INPUT_PAYLOAD_TRANSPORT}" >&2
              exit 1
              ;;
          esac

          {
            echo "Coordinator operation: ${INPUT_OPERATION_ID}"
            echo "Coordinator request: ${INPUT_REQUEST_ID}"
            echo "Frozen target and CI: ${TARGET_SHA}, ${INPUT_CI_RUN_ID}/${INPUT_CI_RUN_ATTEMPT}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve target frontend and acceptance profiles
        run: |
          set -euo pipefail
          target_profile_file="${RUNNER_TEMP}/frontend-profile-${TARGET_SHA}.txt"
          if git cat-file -e "${TARGET_SHA}:frontend-profile.txt" 2>/dev/null; then
            git show "${TARGET_SHA}:frontend-profile.txt" > "$target_profile_file"
            profile_file_present=true
          else
            profile_file_present=false
          fi
          frontend_profile="$(python3 Scripts/Frontend/resolve_frontend_profile.py --profile-file "$target_profile_file" --legacy-blazor-default)"
          acceptance_profile="$(python3 Scripts/Frontend/resolve_frontend_profile.py --profile-file "$target_profile_file" --acceptance-profile --legacy-blazor-default)"
          {
            echo "FRONTEND_PROFILE=${frontend_profile}"
            echo "ACCEPTANCE_PROFILE=${acceptance_profile}"
            echo "TARGET_PROFILE_FILE_PRESENT=${profile_file_present}"
          } >> "$GITHUB_ENV"

      - name: Common release settings validation
        run: bash Deployment/Common/Scripts/validate-common-release.sh

      - name: Load deployment settings
        run: |
          APP_NAME="$(bash Deployment/LocalCluster/Scripts/read-deploy-setting.sh app_name)"
          DEPLOY_ROOT="$(bash Deployment/LocalCluster/Scripts/read-deploy-setting.sh deploy_root)"
          APP_IMAGE="$(bash Deployment/Common/Scripts/read-release-setting.sh app_image)"
          PUBLIC_HOSTNAME="$(bash Deployment/LocalCluster/Scripts/read-deploy-setting.sh public_hostname)"
          MIGRATION_BUNDLE_NAME="$(bash Deployment/Common/Scripts/read-release-setting.sh migration_bundle_name)"
          MIGRATION_ARTIFACT_NAME="$(bash Deployment/Common/Scripts/read-release-setting.sh migration_artifact_name)"
          RELEASE_PAYLOAD_PREFIX="$(bash Deployment/Common/Scripts/read-release-setting.sh release_payload_prefix)"
          MIGRATION_RUNTIME="$(bash Deployment/Common/Scripts/read-release-setting.sh migration_runtime)"
          RUNNER_LABEL="$(bash Deployment/LocalCluster/Scripts/read-deploy-setting.sh runner_label)"
          {
            echo "APP_NAME=${APP_NAME}"
            echo "DEPLOY_ROOT=${DEPLOY_ROOT}"
            echo "APP_IMAGE=${APP_IMAGE}"
            echo "PUBLIC_HOSTNAME=${PUBLIC_HOSTNAME}"
            echo "MIGRATION_BUNDLE_NAME=${MIGRATION_BUNDLE_NAME}"
            echo "MIGRATION_ARTIFACT_NAME=${MIGRATION_ARTIFACT_NAME}"
            echo "RELEASE_PAYLOAD_PREFIX=${RELEASE_PAYLOAD_PREFIX}"
            echo "MIGRATION_RUNTIME=${MIGRATION_RUNTIME}"
            echo "RUNNER_LABEL=${RUNNER_LABEL}"
            echo "SOURCE_REPO_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "APP_VERSION=${TARGET_SHA}"
          } >> "$GITHUB_ENV"
          {
            echo "Deploying image:"
            printf '%s:%s\n' "${APP_IMAGE}" "${TARGET_SHA}"
            echo
            echo "Public hostname:"
            printf '%s\n' "${PUBLIC_HOSTNAME}"
            echo
            echo "Expected app runner label:"
            printf '%s\n' "${RUNNER_LABEL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GHCR
        if: inputs.local_payload_pin_key == ''
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Receipt selection, immutable pull and legacy download share the lock
      # used by release retention.
      - name: Select and retrieve the release payload under the shared lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCAL_PAYLOAD_PIN_KEY: ${{ inputs.local_payload_pin_key }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
          INPUT_CI_RUN_ID: ${{ inputs.ci_run_id }}
          INPUT_CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
          INPUT_PAYLOAD_TRANSPORT: ${{ inputs.payload_transport }}
          INPUT_PAYLOAD_IMAGE: ${{ inputs.payload_image }}
          INPUT_PAYLOAD_DIGEST: ${{ inputs.payload_digest }}
          INPUT_ARTIFACT_ID: ${{ inputs.artifact_id }}
          INPUT_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          INPUT_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          INPUT_IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          bash Deployment/Common/Scripts/with-deploy-lock.sh bash -euo pipefail <<'LOCKED'
            set -euo pipefail
            bash Deployment/LocalCluster/Scripts/prepare-release-pin-root.sh "$DEPLOY_ROOT"
            RELEASE_PAYLOAD_PIN_KEY=""
            if [[ -n "$LOCAL_PAYLOAD_PIN_KEY" ]]; then
              [[ "$LOCAL_PAYLOAD_PIN_KEY" =~ ^(ghcr-[0-9a-f]{64}-[0-9a-f]{64}|legacy-[1-9][0-9]{0,19}-[0-9a-f]{64})$ ]] || { echo "local_payload_pin_key is malformed" >&2; exit 1; }
              pin_dir="${DEPLOY_ROOT}/release-payloads/${GITHUB_REPOSITORY//\//-}/${LOCAL_PAYLOAD_PIN_KEY}"
              pin_result="$(python3 Deployment/Common/Scripts/Component/lib/pin_release_payload.py \
                --restore "$pin_dir" --output-dir artifacts/migrations \
                --repository "$SOURCE_REPO_URL" --target-sha "$TARGET_SHA" \
                --profile "$FRONTEND_PROFILE" --acceptance-profile "$ACCEPTANCE_PROFILE" \
                --runtime "$MIGRATION_RUNTIME" --app-image "$APP_IMAGE" \
                --payload-image-prefix "$RELEASE_PAYLOAD_PREFIX" --bundle-name "$MIGRATION_BUNDLE_NAME")"
              printf "%s" "$pin_result" > "${RUNNER_TEMP}/restored-release-payload.json"
              CI_RUN_ID="$(python3 -c "import json,sys; print(json.loads(sys.argv[1])[\"run_id\"])" "$pin_result")"
              CI_RUN_ATTEMPT="$(python3 -c "import json,sys; print(json.loads(sys.argv[1])[\"run_attempt\"])" "$pin_result")"
              RELEASE_IMAGE_DIGEST="$(python3 -c "import json,sys; print(json.loads(sys.argv[1])[\"image_digest\"])" "$pin_result")"
              RELEASE_MANIFEST_SCHEMA_VERSION="$(python3 -c "import json,sys; print(json.loads(sys.argv[1])[\"manifest_schema_version\"])" "$pin_result")"
              RELEASE_PAYLOAD_TRANSPORT="local-pin"
              RELEASE_PAYLOAD_PIN_KEY="$LOCAL_PAYLOAD_PIN_KEY"
              echo "Restored exact local release pin ${LOCAL_PAYLOAD_PIN_KEY} without Actions or GHCR payload access." >> "$GITHUB_STEP_SUMMARY"
            else
            ci_result="$(python3 Deployment/Common/Scripts/Component/lib/find-successful-ci-run.py \
              --target-sha "$TARGET_SHA" --read-final-payload-receipt \
              --payload-profile "$FRONTEND_PROFILE" \
              --payload-acceptance-profile "$ACCEPTANCE_PROFILE" \
              --payload-runtime "$MIGRATION_RUNTIME" \
              --payload-app-image "$APP_IMAGE" --payload-app-image-prefix "$RELEASE_PAYLOAD_PREFIX" \
              --expected-run-id "$INPUT_CI_RUN_ID" --expected-run-attempt "$INPUT_CI_RUN_ATTEMPT" --json)" || {
              echo "No successful main CI run for ${TARGET_SHA}: ${ci_result:-no result}" >&2
              exit 1
            }
            CI_RUN_ID="$(python3 -c "import json,sys; print(json.loads(sys.argv[1])[\"selected\"][\"id\"])" "$ci_result")"
            CI_RUN_ATTEMPT="$(python3 -c "import json,sys; print(json.loads(sys.argv[1])[\"selected\"][\"run_attempt\"])" "$ci_result")"
            outcome="$(python3 -c "import json,sys; print(json.loads(sys.argv[1])[\"outcome\"])" "$ci_result")"
            selection_file="${RUNNER_TEMP}/selected-release-payload.json"
            printf "%s" "$ci_result" > "$selection_file"
            case "$outcome" in
              success)
                payload_result="$(python3 Deployment/Common/Scripts/Component/lib/pull_release_payload.py \
                  --selection-file "$selection_file" --output-dir artifacts/migrations \
                  --repository "$SOURCE_REPO_URL" --profile "$FRONTEND_PROFILE" \
                  --acceptance-profile "$ACCEPTANCE_PROFILE" --runtime "$MIGRATION_RUNTIME" \
                  --app-image "$APP_IMAGE" --payload-image-prefix "$RELEASE_PAYLOAD_PREFIX" \
                  --bundle-name "$MIGRATION_BUNDLE_NAME")"
                printf "%s" "$payload_result" > "${RUNNER_TEMP}/pulled-release-payload.json"
                pin_result="$(python3 Deployment/Common/Scripts/Component/lib/pin_release_payload.py \
                  --staging artifacts/migrations --selection-file "$selection_file" \
                  --root "${DEPLOY_ROOT}/release-payloads/${GITHUB_REPOSITORY//\//-}" \
                  --repository "$SOURCE_REPO_URL" --profile "$FRONTEND_PROFILE" \
                  --acceptance-profile "$ACCEPTANCE_PROFILE" --runtime "$MIGRATION_RUNTIME" \
                  --app-image "$APP_IMAGE" --payload-image-prefix "$RELEASE_PAYLOAD_PREFIX" \
                  --bundle-name "$MIGRATION_BUNDLE_NAME")"
                printf "%s" "$pin_result" > "${RUNNER_TEMP}/pinned-release-payload.json"
                pin_key="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["pin_key"])' "$pin_result")"
                RELEASE_PAYLOAD_PIN_KEY="$pin_key"
                echo "Pinned exact GHCR release payload locally: ${pin_key}." >> "$GITHUB_STEP_SUMMARY"
                RELEASE_PAYLOAD_TRANSPORT="ghcr-container"
                echo "Using immutable GHCR payload selected from the successful CI receipt." >> "$GITHUB_STEP_SUMMARY"
                ;;
              legacy_artifact)
                pin_result="$(python3 Deployment/Common/Scripts/Component/lib/import_legacy_release_payload.py \
                  --selection-file "$selection_file" \
                  --root "${DEPLOY_ROOT}/release-payloads/${GITHUB_REPOSITORY//\//-}" \
                  --repository "$GITHUB_REPOSITORY" --repository-url "$SOURCE_REPO_URL" \
                  --artifact-name "$MIGRATION_ARTIFACT_NAME" \
                  --profile "$FRONTEND_PROFILE" --acceptance-profile "$ACCEPTANCE_PROFILE" \
                  --runtime "$MIGRATION_RUNTIME" --app-image "$APP_IMAGE" \
                  --bundle-name "$MIGRATION_BUNDLE_NAME")"
                printf "%s" "$pin_result" > "${RUNNER_TEMP}/pinned-legacy-release-payload.json"
                pin_key="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["pin_key"])' "$pin_result")"
                restored_result="$(python3 Deployment/Common/Scripts/Component/lib/pin_release_payload.py \
                  --restore "${DEPLOY_ROOT}/release-payloads/${GITHUB_REPOSITORY//\//-}/${pin_key}" \
                  --output-dir artifacts/migrations --repository "$SOURCE_REPO_URL" \
                  --target-sha "$TARGET_SHA" --profile "$FRONTEND_PROFILE" \
                  --acceptance-profile "$ACCEPTANCE_PROFILE" --runtime "$MIGRATION_RUNTIME" \
                  --app-image "$APP_IMAGE" --payload-image-prefix "$RELEASE_PAYLOAD_PREFIX" \
                  --bundle-name "$MIGRATION_BUNDLE_NAME")"
                RELEASE_PAYLOAD_PIN_KEY="$pin_key"
                RELEASE_IMAGE_DIGEST="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["image_digest"])' "$restored_result")"
                RELEASE_MANIFEST_SCHEMA_VERSION="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["manifest_schema_version"])' "$restored_result")"
                RELEASE_PAYLOAD_TRANSPORT="actions-artifact"
                echo "Pinned exact legacy artifact ${pin_key} and restored its verified payload; application image will use its normal registry pull." >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                echo "CI selector returned unsupported outcome: ${outcome}" >&2
                exit 1
                ;;
            esac
            fi
            if [[ -n "$INPUT_REQUEST_ID" ]]; then
              python3 - "$pin_result" <<'PY'
          import json
          import os
          import sys

          payload = json.loads(sys.argv[1])
          expected = {
              "target_sha": os.environ["TARGET_SHA"],
              "run_id": os.environ["INPUT_CI_RUN_ID"],
              "run_attempt": os.environ["INPUT_CI_RUN_ATTEMPT"],
              "transport": os.environ["INPUT_PAYLOAD_TRANSPORT"],
              "manifest_sha256": os.environ["INPUT_MANIFEST_SHA256"],
              "image_digest": os.environ["INPUT_IMAGE_DIGEST"],
          }
          if os.environ["INPUT_PAYLOAD_TRANSPORT"] == "actions-artifact":
              expected.update({
                  "artifact_id": os.environ["INPUT_ARTIFACT_ID"],
                  "artifact_digest": os.environ["INPUT_ARTIFACT_DIGEST"],
              })
          else:
              expected.update({
                  "payload_image": os.environ["INPUT_PAYLOAD_IMAGE"],
                  "payload_digest": os.environ["INPUT_PAYLOAD_DIGEST"],
              })
          for key, value in expected.items():
              if str(payload.get(key, "")) != value:
                  raise SystemExit(f"Selected release payload {key} differs from frozen coordinator provenance.")
          PY
            fi
            {
              echo "CI_RUN_ID=${CI_RUN_ID}"
              echo "CI_RUN_ATTEMPT=${CI_RUN_ATTEMPT}"
              echo "RELEASE_PAYLOAD_TRANSPORT=${RELEASE_PAYLOAD_TRANSPORT}"
              echo "RELEASE_PAYLOAD_PIN_KEY=${RELEASE_PAYLOAD_PIN_KEY}"
              if [[ "$RELEASE_PAYLOAD_TRANSPORT" == local-pin || "$RELEASE_PAYLOAD_TRANSPORT" == actions-artifact ]]; then
                echo "RELEASE_IMAGE_DIGEST=${RELEASE_IMAGE_DIGEST}"
                echo "RELEASE_MANIFEST_SCHEMA_VERSION=${RELEASE_MANIFEST_SCHEMA_VERSION}"
              fi
            } >> "$GITHUB_ENV"
            echo "Using successful CI run: ${CI_RUN_ID} attempt ${CI_RUN_ATTEMPT}" >> "$GITHUB_STEP_SUMMARY"
          LOCKED

      - name: Capture registry release descriptor
        run: |
          if [[ "$RELEASE_PAYLOAD_TRANSPORT" != local-pin ]]; then
            docker pull --quiet "${APP_IMAGE}:${TARGET_SHA}"
            docker image inspect "${APP_IMAGE}:${TARGET_SHA}" \
              --format '{{json .RepoDigests}}' > "${RUNNER_TEMP}/release-registry-repodigests.json"
            docker image inspect "${APP_IMAGE}:${TARGET_SHA}" \
              --format '{{json .Config.Labels}}' > "${RUNNER_TEMP}/release-image-labels.json"
            echo "REGISTRY_MANIFEST_PATH=${RUNNER_TEMP}/release-registry-repodigests.json" >> "$GITHUB_ENV"
            echo "IMAGE_LABELS_PATH=${RUNNER_TEMP}/release-image-labels.json" >> "$GITHUB_ENV"
          fi

      - name: Validate release manifest
        run: |
          set -euo pipefail
          test -f artifacts/migrations/release-manifest.json
          if [[ "$RELEASE_PAYLOAD_TRANSPORT" == local-pin ]]; then
            chmod 0750 "artifacts/migrations/${MIGRATION_BUNDLE_NAME}"
            echo "Exact offline local pin validated for ${TARGET_SHA}, CI ${CI_RUN_ID}/${CI_RUN_ATTEMPT}, digest ${RELEASE_IMAGE_DIGEST}." >> "$GITHUB_STEP_SUMMARY"
          else
          RELEASE_MANIFEST_SCHEMA_VERSION="$(python3 -c 'import json; print(json.load(open("artifacts/migrations/release-manifest.json", encoding="utf-8"))["schema_version"])')"
          if [[ "$RELEASE_MANIFEST_SCHEMA_VERSION" == 2 && "$TARGET_PROFILE_FILE_PRESENT" != true ]]; then
            echo "Schema-v2 releases require frontend-profile.txt in the selected source commit." >&2
            exit 1
          fi
          RELEASE_IMAGE_DIGEST="$(python3 Deployment/Common/Scripts/validate_release_manifest.py \
            --manifest artifacts/migrations/release-manifest.json \
            --registry-json "$REGISTRY_MANIFEST_PATH" \
            --bundle-dir artifacts/migrations \
            --expected-repository "$SOURCE_REPO_URL" \
            --expected-sha "$TARGET_SHA" \
            --expected-ci-run-id "$CI_RUN_ID" \
            --expected-ci-run-attempt "$CI_RUN_ATTEMPT" \
            --expected-image "$APP_IMAGE" \
            --expected-bundle-name "$MIGRATION_BUNDLE_NAME" \
            --expected-frontend-profile "$FRONTEND_PROFILE" \
            --expected-acceptance-profile "$ACCEPTANCE_PROFILE" \
            --image-labels-json "$IMAGE_LABELS_PATH")"
          echo "RELEASE_IMAGE_DIGEST=${RELEASE_IMAGE_DIGEST}" >> "$GITHUB_ENV"
          echo "RELEASE_MANIFEST_SCHEMA_VERSION=${RELEASE_MANIFEST_SCHEMA_VERSION}" >> "$GITHUB_ENV"
          chmod 0750 "artifacts/migrations/${MIGRATION_BUNDLE_NAME}"
          echo "Release manifest verified: ${APP_IMAGE}:${TARGET_SHA} ${RELEASE_IMAGE_DIGEST} ${FRONTEND_PROFILE}/${ACCEPTANCE_PROFILE}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$RELEASE_MANIFEST_SCHEMA_VERSION" == 1 ]]; then
            echo "Legacy release manifest v1 is explicitly treated as BlazorAuto/BlazorAutoV1." >> "$GITHUB_STEP_SUMMARY"
          fi
          fi

      # Check only: CI/CD jobs never run apt. Provision on the control machine with
      # Deployment/LocalCluster/Scripts/install-ansible.sh --provision.
      - name: Activate validated Ansible generation
        run: |
          bash Deployment/LocalCluster/Scripts/install-ansible.sh --check
          ansible_root="$(readlink -f "${HOME}/.local/share/books-ansible/current")"
          test -x "${ansible_root}/bin/ansible-playbook"
          echo "${ansible_root}/bin" >> "$GITHUB_PATH"

      - name: Write Ansible Vault password
        run: |
          umask 077
          VAULT_PASSWORD_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/${APP_NAME}_ansible_vault_password.XXXXXX")"
          echo "ANSIBLE_VAULT_PASSWORD_FILE=${VAULT_PASSWORD_FILE}" >> "$GITHUB_ENV"
          printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > "${VAULT_PASSWORD_FILE}"

      # Nodes pull the image with this job's token, so no long-lived registry
      # token is stored in the vault. Extra vars override vault values.
      - name: Write GHCR deploy credentials
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ inputs.local_payload_pin_key == '' && secrets.GITHUB_TOKEN || '' }}
        run: |
          umask 077
          GHCR_EXTRA_VARS_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/${APP_NAME}_ghcr_deploy_vars.XXXXXX")"
          echo "GHCR_EXTRA_VARS_FILE=${GHCR_EXTRA_VARS_FILE}" >> "$GITHUB_ENV"
          export GHCR_EXTRA_VARS_FILE
          python3 - <<'PY'
          import json
          import os

          values = {
              "vault_ghcr_username": os.environ["GHCR_USERNAME"],
              "vault_ghcr_token": os.environ["GHCR_TOKEN"],
          }
          with open(os.environ["GHCR_EXTRA_VARS_FILE"], "w", encoding="utf-8") as output:
              json.dump(values, output, sort_keys=True)
              output.write("\n")
          PY

      - name: Check node-main capacity
        run: bash Deployment/LocalCluster/Scripts/check-node-main-capacity.sh

      - name: Deployment preflight
        run: bash Deployment/LocalCluster/Scripts/preflight.sh deploy

      - name: Deploy with migrations
        if: inputs.run_migrations == 'true'
        working-directory: Deployment/LocalCluster/ansible
        run: |
          bash ../../Common/Scripts/with-deploy-lock.sh \
            ansible-playbook -i ../inventory/prod/hosts.yml playbooks/site.yml \
            --vault-password-file "${ANSIBLE_VAULT_PASSWORD_FILE}" \
            -e @"${GHCR_EXTRA_VARS_FILE}" \
            -e "app_version=${APP_VERSION}" \
            -e "release_payload_transport=${RELEASE_PAYLOAD_TRANSPORT}" \
            -e "release_payload_pin_key=${RELEASE_PAYLOAD_PIN_KEY}" \
            -e "release_image_digest=${RELEASE_IMAGE_DIGEST}" \
            -e "release_frontend_profile=${FRONTEND_PROFILE}" \
            -e "release_acceptance_profile=${ACCEPTANCE_PROFILE}" \
            -e "release_manifest_schema_version=${RELEASE_MANIFEST_SCHEMA_VERSION}" \
            -e "release_source_sha=${TARGET_SHA}" \
            -e "release_ci_run_id=${CI_RUN_ID}" \
            -e "release_ci_run_attempt=${CI_RUN_ATTEMPT}" \
            -e "source_repo_url=${SOURCE_REPO_URL}" \
            -e run_migrations=true \
            -e "migration_bundle_local_path=${{ github.workspace }}/artifacts/migrations/${MIGRATION_BUNDLE_NAME}"

      - name: Deploy without migrations
        if: inputs.run_migrations == 'false'
        working-directory: Deployment/LocalCluster/ansible
        run: |
          bash ../../Common/Scripts/with-deploy-lock.sh \
            ansible-playbook -i ../inventory/prod/hosts.yml playbooks/site.yml \
            --vault-password-file "${ANSIBLE_VAULT_PASSWORD_FILE}" \
            -e @"${GHCR_EXTRA_VARS_FILE}" \
            -e "app_version=${APP_VERSION}" \
            -e "release_payload_transport=${RELEASE_PAYLOAD_TRANSPORT}" \
            -e "release_payload_pin_key=${RELEASE_PAYLOAD_PIN_KEY}" \
            -e "release_image_digest=${RELEASE_IMAGE_DIGEST}" \
            -e "release_frontend_profile=${FRONTEND_PROFILE}" \
            -e "release_acceptance_profile=${ACCEPTANCE_PROFILE}" \
            -e "release_manifest_schema_version=${RELEASE_MANIFEST_SCHEMA_VERSION}" \
            -e "release_source_sha=${TARGET_SHA}" \
            -e "release_ci_run_id=${CI_RUN_ID}" \
            -e "release_ci_run_attempt=${CI_RUN_ATTEMPT}" \
            -e "source_repo_url=${SOURCE_REPO_URL}"

      - name: Verify running release identity
        run: bash Deployment/LocalCluster/Scripts/verify-release-identity.sh "${APP_IMAGE}" "${RELEASE_IMAGE_DIGEST}" "${FRONTEND_PROFILE}" "${ACCEPTANCE_PROFILE}" "${TARGET_SHA}" "${RELEASE_MANIFEST_SCHEMA_VERSION}" "${CI_RUN_ID}" "${CI_RUN_ATTEMPT}" "${SOURCE_REPO_URL}"

      - name: Run acceptance check
        run: bash Deployment/LocalCluster/Scripts/acceptance-check.sh

      - name: Run observability doctor
        run: |
          if [ "$(bash Deployment/LocalCluster/Scripts/read-deploy-setting.sh observability_enabled)" = "true" ]; then
            bash Deployment/LocalCluster/Scripts/observability-doctor.sh
          else
            echo "observability_enabled is false; skipping observability doctor"
          fi

      - name: Remove temporary credential files
        if: always()
        run: |
          if [ -n "${ANSIBLE_VAULT_PASSWORD_FILE:-}" ]; then
            rm -f "${ANSIBLE_VAULT_PASSWORD_FILE}"
          fi
          if [ -n "${GHCR_EXTRA_VARS_FILE:-}" ]; then
            rm -f "${GHCR_EXTRA_VARS_FILE}"
          fi
          if [ -n "${DOCKER_CONFIG:-}" ] && [ -d "${DOCKER_CONFIG}" ]; then
            rm -rf "${DOCKER_CONFIG}"
          fi
