name: LocalCluster Docker Maintenance

# Host and Docker maintenance stays manual. The separate artifact-only job runs
# daily under the shared deployment lock. See Deployment/LocalCluster/HowToDeployLocalCluster.md.
on:
  workflow_dispatch:
    inputs:
      artifact_only:
        description: Run artifact retention without host or Docker maintenance; preview unless apply_artifacts is true
        type: boolean
        required: false
        default: false
      apply_artifacts:
        description: Apply GitHub Actions artifact retention during this manual dispatch
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  prune:
    if: github.event_name == 'workflow_dispatch' && inputs.artifact_only != true
    concurrency:
      group: localcluster-docker-maintenance
      cancel-in-progress: false
    runs-on: [self-hosted, linux, x64, "${{ vars.LOCALCLUSTER_RUNNER_LABEL || 'localcluster-books' }}"]
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read

    steps:
      - name: Require this deployment target to be enabled
        env:
          DEPLOY_TARGETS: ${{ vars.DEPLOY_TARGETS }}
          TARGET: localcluster
        run: |
          targets=",${DEPLOY_TARGETS// /},"
          if [[ "$targets" != *",${TARGET},"* ]]; then
            echo "::error::Deployment target '${TARGET}' is not enabled. Add it to the DEPLOY_TARGETS repository variable (Settings > Secrets and variables > Actions > Variables), for example 'localcluster,localsinglenode'."
            exit 1
          fi

      - name: Verify node-main runner
        run: |
          echo "Runner name: ${RUNNER_NAME:-unknown}"
          echo "Host: $(hostname)"
          test "$(hostname)" = "node-main"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Activate validated Ansible generation
        run: |
          bash Deployment/LocalCluster/Scripts/install-ansible.sh --check
          ansible_root="$(readlink -f "${HOME}/.local/share/books-ansible/current")"
          test -x "${ansible_root}/bin/ansible-playbook"
          echo "${ansible_root}/bin" >> "$GITHUB_PATH"

      - name: Run LocalCluster maintenance under the deployment lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCALCLUSTER_DEPLOY_LOCK_TIMEOUT_SECONDS: "300"
        run: bash Deployment/LocalCluster/Scripts/run-localcluster-maintenance.sh

  prune-migration-artifacts:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
    concurrency:
      group: template-artifact-retention
      cancel-in-progress: false
    # Independent of host/Docker cleanup so an unavailable node does not
    # silently prevent the retention policy from being applied.
    runs-on: [self-hosted, linux, x64, "${{ vars.LOCALCLUSTER_RUNNER_LABEL || 'localcluster-books' }}"]
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read

    steps:
      - name: Require this deployment target to be enabled
        env:
          DEPLOY_TARGETS: ${{ vars.DEPLOY_TARGETS }}
          TARGET: localcluster
        run: |
          targets=",${DEPLOY_TARGETS// /},"
          if [[ "$targets" != *",${TARGET},"* ]]; then
            echo "::error::Deployment target '${TARGET}' is not enabled. Add it to the DEPLOY_TARGETS repository variable (Settings > Secrets and variables > Actions > Variables), for example 'localcluster,localsinglenode'."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Require green main CI for unchanged operation code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 Deployment/Common/Scripts/verify-operation-source.py > /dev/null

      - name: Verify node-main runner
        run: |
          echo "Runner name: ${RUNNER_NAME:-unknown}"
          echo "Host: $(hostname)"
          test "$(hostname)" = "node-main"

      - name: Activate validated Ansible generation
        run: |
          bash Deployment/LocalCluster/Scripts/install-ansible.sh --check
          ansible_root="$(readlink -f "${HOME}/.local/share/books-ansible/current")"
          test -x "${ansible_root}/bin/ansible"
          echo "${ansible_root}/bin" >> "$GITHUB_PATH"

      - name: Prune old migration bundle artifacts under the shared deployment lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIONS_ARTIFACT_RETENTION_ENABLED: ${{ (github.event.schedule == '17 3 * * *' || (github.event_name == 'workflow_dispatch' && inputs.apply_artifacts == true)) && (vars.ACTIONS_ARTIFACT_RETENTION_ENABLED || 'false') }}
        run: bash Deployment/Common/Scripts/with-deploy-lock.sh bash Deployment/LocalCluster/Scripts/prune-migration-artifacts.sh
