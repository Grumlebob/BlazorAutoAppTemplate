name: CD - Cloud

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Run the EF migration bundle before starting app servers
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: cd-cloud
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, "${{ vars.LOCALCLUSTER_RUNNER_LABEL || 'localcluster-books' }}"]
    environment:
      name: cloud-hetzner
    env:
      CLOUD_SSH_PRIVATE_KEY_PATH: ${{ github.workspace }}/.cloud-ssh/bookscloud_deploy
      CLOUD_BASTION_HOST: ${{ secrets.CLOUD_BASTION_HOST }}
      CLOUD_TEMP_SSH_FIREWALL_ID: ${{ secrets.CLOUD_TEMP_SSH_FIREWALL_ID }}
      CLOUD_HETZNER_API_TOKEN: ${{ secrets.CLOUD_HETZNER_API_TOKEN }}
      # Cloud nodes pull the image with this job's token; no GHCR PAT is stored.
      CLOUD_GHCR_USERNAME: ${{ github.actor }}
      CLOUD_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUD_POSTGRES_USER: ${{ secrets.CLOUD_POSTGRES_USER }}
      CLOUD_POSTGRES_PASSWORD: ${{ secrets.CLOUD_POSTGRES_PASSWORD }}
      CLOUD_POSTGRES_DB: ${{ secrets.CLOUD_POSTGRES_DB }}
      CLOUD_REDIS_PASSWORD: ${{ secrets.CLOUD_REDIS_PASSWORD }}
      CLOUD_ACCOUNTS_ADMIN_SEED_PASSWORD: ${{ secrets.CLOUD_ACCOUNTS_ADMIN_SEED_PASSWORD }}
      CLOUD_ACCOUNTS_EMAIL_USERNAME: ${{ secrets.CLOUD_ACCOUNTS_EMAIL_USERNAME }}
      CLOUD_ACCOUNTS_EMAIL_PASSWORD: ${{ secrets.CLOUD_ACCOUNTS_EMAIL_PASSWORD }}
      CLOUD_DATA_PROTECTION_CERTIFICATE_BASE64: ${{ secrets.CLOUD_DATA_PROTECTION_CERTIFICATE_BASE64 }}
      CLOUD_DATA_PROTECTION_CERTIFICATE_PASSWORD: ${{ secrets.CLOUD_DATA_PROTECTION_CERTIFICATE_PASSWORD }}
      CLOUD_CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUD_CLOUDFLARE_TUNNEL_TOKEN }}

    steps:
      - name: Require this deployment target to be enabled
        env:
          DEPLOY_TARGETS: ${{ vars.DEPLOY_TARGETS }}
          TARGET: cloud
        run: |
          targets=",${DEPLOY_TARGETS// /},"
          if [[ "$targets" != *",${TARGET},"* ]]; then
            echo "::error::Deployment target '${TARGET}' is not enabled. Add it to the DEPLOY_TARGETS repository variable (Settings > Secrets and variables > Actions > Variables), for example 'localcluster,localsinglenode'."
            exit 1
          fi

      - name: Require main branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "CD - Cloud must be dispatched from main, got ${GITHUB_REF}." >&2
            exit 1
          fi

      - name: Verify node-main runner
        run: |
          echo "Runner name: ${RUNNER_NAME:-unknown}"
          echo "Host: $(hostname)"
          test "$(hostname)" = "node-main"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate deployment settings
        run: |
          bash Deployment/Common/Scripts/validate-common-release.sh
          bash Deployment/Cloud/Scripts/validate-cloud-settings.sh

      - name: Load deployment settings
        run: |
          APP_NAME="$(bash Deployment/Cloud/Scripts/read-cloud-setting.sh app_name)"
          APP_IMAGE="$(bash Deployment/Common/Scripts/read-release-setting.sh app_image)"
          PUBLIC_HOSTNAME="$(bash Deployment/Cloud/Scripts/read-cloud-setting.sh public_hostname)"
          MIGRATION_BUNDLE_NAME="$(bash Deployment/Common/Scripts/read-release-setting.sh migration_bundle_name)"
          MIGRATION_ARTIFACT_NAME="$(bash Deployment/Common/Scripts/read-release-setting.sh migration_artifact_name)"
          MIGRATION_RUNTIME="$(bash Deployment/Common/Scripts/read-release-setting.sh migration_runtime)"
          RELEASE_PAYLOAD_PREFIX="$(bash Deployment/Common/Scripts/read-release-setting.sh release_payload_prefix)"
          FRONTEND_PROFILE="$(python3 Scripts/Frontend/resolve_frontend_profile.py)"
          ACCEPTANCE_PROFILE="$(python3 Scripts/Frontend/resolve_frontend_profile.py --acceptance-profile)"
          {
            echo "APP_NAME=${APP_NAME}"
            echo "APP_IMAGE=${APP_IMAGE}"
            echo "PUBLIC_HOSTNAME=${PUBLIC_HOSTNAME}"
            echo "MIGRATION_BUNDLE_NAME=${MIGRATION_BUNDLE_NAME}"
            echo "MIGRATION_ARTIFACT_NAME=${MIGRATION_ARTIFACT_NAME}"
            echo "MIGRATION_RUNTIME=${MIGRATION_RUNTIME}"
            echo "RELEASE_PAYLOAD_PREFIX=${RELEASE_PAYLOAD_PREFIX}"
            echo "FRONTEND_PROFILE=${FRONTEND_PROFILE}"
            echo "ACCEPTANCE_PROFILE=${ACCEPTANCE_PROFILE}"
            echo "SOURCE_REPO_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "APP_VERSION=${GITHUB_SHA}"
          } >> "$GITHUB_ENV"
          {
            echo "Deploying image:"
            printf '%s:%s\n' "${APP_IMAGE}" "${GITHUB_SHA}"
            echo
            echo "Public hostname:"
            printf '%s\n' "${PUBLIC_HOSTNAME}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select successful CI receipt for this commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          selection_file="${RUNNER_TEMP}/selected-release-payload.json"
          ci_result="$(python3 Deployment/Common/Scripts/Component/lib/find-successful-ci-run.py \
            --target-sha "$GITHUB_SHA" --read-final-payload-receipt \
            --payload-profile "$FRONTEND_PROFILE" \
            --payload-acceptance-profile "$ACCEPTANCE_PROFILE" \
            --payload-runtime "$MIGRATION_RUNTIME" \
            --payload-app-image "$APP_IMAGE" \
            --payload-app-image-prefix "$RELEASE_PAYLOAD_PREFIX" --json)" || {
            echo "No successful main CI receipt for ${GITHUB_SHA}: ${ci_result:-no result}" >&2
            exit 1
          }
          printf '%s' "$ci_result" > "$selection_file"
          CI_RUN_ID="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["selected"]["id"])' "$ci_result")"
          CI_RUN_ATTEMPT="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["selected"]["run_attempt"])' "$ci_result")"
          CI_SELECTION_FILE="$selection_file"
          {
            echo "CI_SELECTION_FILE=${CI_SELECTION_FILE}"
            echo "CI_RUN_ID=${CI_RUN_ID}"
            echo "CI_RUN_ATTEMPT=${CI_RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"
          echo "Using successful CI run: ${CI_RUN_ID} attempt ${CI_RUN_ATTEMPT}" >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image exists
        run: docker manifest inspect "${APP_IMAGE}:${APP_VERSION}" >/dev/null

      - name: Retrieve migration bundle from immutable payload
        if: inputs.run_migrations == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCALCLUSTER_DEPLOY_LOCK_TIMEOUT_SECONDS: "300"
        run: |
          bash Deployment/Common/Scripts/with-deploy-lock.sh bash -euo pipefail <<'LOCKED'
          python3 Deployment/Common/Scripts/registry-retention.py --assert-clear
          outcome="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["outcome"])' "$CI_SELECTION_FILE")"
          case "$outcome" in
            success)
              python3 Deployment/Common/Scripts/Component/lib/pull_release_payload.py \
                --selection-file "$CI_SELECTION_FILE" --output-dir artifacts/migrations \
                --repository "$SOURCE_REPO_URL" --profile "$FRONTEND_PROFILE" \
                --acceptance-profile "$ACCEPTANCE_PROFILE" --runtime "$MIGRATION_RUNTIME" \
                --app-image "$APP_IMAGE" --payload-image-prefix "$RELEASE_PAYLOAD_PREFIX" \
                --bundle-name "$MIGRATION_BUNDLE_NAME"
              echo "Retrieved migration bundle from immutable GHCR payload." >> "$GITHUB_STEP_SUMMARY"
              ;;
            legacy_artifact)
              mkdir -p artifacts/migrations
              gh run download "$CI_RUN_ID" --name "$MIGRATION_ARTIFACT_NAME" --dir artifacts/migrations
              echo "Selected a legacy Actions artifact for this pre-receipt CI run." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) echo "Unsupported CI payload outcome: ${outcome}" >&2; exit 1 ;;
          esac
          LOCKED

      - name: Prepare migration bundle
        if: inputs.run_migrations == 'true'
        run: |
          test -f "artifacts/migrations/${MIGRATION_BUNDLE_NAME}"
          chmod 0750 "artifacts/migrations/${MIGRATION_BUNDLE_NAME}"

      # Check only: CI/CD jobs never run apt. Provision the runner host with
      # Deployment/Common/Scripts/install-ansible.sh --provision.
      - name: Activate validated Ansible generation
        run: |
          bash Deployment/Common/Scripts/install-ansible.sh --check
          ansible_root="$(readlink -f "${HOME}/.local/share/books-ansible/current")"
          test -x "${ansible_root}/bin/ansible-playbook"
          echo "${ansible_root}/bin" >> "$GITHUB_PATH"

      - name: Determine runner SSH CIDR
        run: |
          RUNNER_PUBLIC_IPV4="$(curl -fsS4 https://checkip.amazonaws.com | tr -d '[:space:]')"
          test -n "$RUNNER_PUBLIC_IPV4"
          echo "RUNNER_SSH_CIDR=${RUNNER_PUBLIC_IPV4}/32" >> "$GITHUB_ENV"

      - name: Allow temporary SSH to cloud-main
        run: bash Deployment/Cloud/Scripts/set-temporary-ssh-firewall.sh allow "$RUNNER_SSH_CIDR"

      - name: Configure SSH key
        env:
          CLOUD_SSH_PRIVATE_KEY: ${{ secrets.CLOUD_SSH_PRIVATE_KEY }}
          CLOUD_RUNNER_SSH_PRIVATE_KEY_PATH: ${{ vars.CLOUD_RUNNER_SSH_PRIVATE_KEY_PATH }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          install -d -m 0700 "$(dirname "$CLOUD_SSH_PRIVATE_KEY_PATH")"
          if [ -n "${CLOUD_RUNNER_SSH_PRIVATE_KEY_PATH:-}" ] && [ -f "$CLOUD_RUNNER_SSH_PRIVATE_KEY_PATH" ]; then
            install -m 0600 "$CLOUD_RUNNER_SSH_PRIVATE_KEY_PATH" "$CLOUD_SSH_PRIVATE_KEY_PATH"
            key_source="runner-local:${CLOUD_RUNNER_SSH_PRIVATE_KEY_PATH}"
          elif [ -n "${CLOUD_SSH_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$CLOUD_SSH_PRIVATE_KEY" > "$CLOUD_SSH_PRIVATE_KEY_PATH"
            chmod 0600 "$CLOUD_SSH_PRIVATE_KEY_PATH"
            key_source="github-environment:CLOUD_SSH_PRIVATE_KEY"
          else
            echo "No Cloud SSH key configured. Set CLOUD_RUNNER_SSH_PRIVATE_KEY_PATH or CLOUD_SSH_PRIVATE_KEY." >&2
            exit 1
          fi
          fingerprint="$(ssh-keygen -y -f "$CLOUD_SSH_PRIVATE_KEY_PATH" | ssh-keygen -lf - -E sha256 | awk '{print $2}')"
          echo "Cloud SSH key source: ${key_source}"
          echo "Cloud SSH public fingerprint: ${fingerprint}"
          for attempt in $(seq 1 30); do
            if ssh-keyscan -H "$CLOUD_BASTION_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "ssh-keyscan failed for ${CLOUD_BASTION_HOST}" >&2
              exit 1
            fi
            sleep 5
          done
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Render Cloud inventory
        run: bash Deployment/Cloud/Scripts/render-inventory-from-env.sh

      - name: Deployment preflight
        run: bash Deployment/Cloud/Scripts/preflight.sh deploy

      - name: Provision Cloud nodes
        run: bash Deployment/Cloud/Scripts/provision.sh

      - name: Deploy with migrations
        if: inputs.run_migrations == 'true'
        run: bash Deployment/Cloud/Scripts/deploy.sh "$APP_VERSION" --migrate "${{ github.workspace }}/artifacts/migrations/${MIGRATION_BUNDLE_NAME}"

      - name: Deploy without migrations
        if: inputs.run_migrations == 'false'
        run: bash Deployment/Cloud/Scripts/deploy.sh "$APP_VERSION"

      - name: Run acceptance check
        run: bash Deployment/Cloud/Scripts/acceptance-check.sh

      - name: Run observability doctor
        run: |
          if [ "$(bash Deployment/Cloud/Scripts/read-cloud-setting.sh observability_enabled)" = "true" ]; then
            bash Deployment/Cloud/Scripts/observability-doctor.sh
          else
            echo "observability_enabled is false; skipping Cloud observability doctor"
          fi

      - name: Remove temporary SSH from cloud-main
        if: always()
        run: bash Deployment/Cloud/Scripts/set-temporary-ssh-firewall.sh clear

      - name: Remove SSH private key
        if: always()
        run: rm -f "$CLOUD_SSH_PRIVATE_KEY_PATH"
