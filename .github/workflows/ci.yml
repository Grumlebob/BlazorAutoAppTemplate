name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      pool:
        description: Select an approved non-publishing canary route on a non-main branch.
        type: choice
        required: true
        default: auto
        options:
          - auto
          - desktop-canary
          - native-canary

permissions:
  contents: read

# Only superseded PR validation shares a cancellable group. Each main run keeps
# its own group so release provenance cannot be displaced by another push.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select-validation:
    name: Select validation runner
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/select-ci-runner.yml
    with:
      stage: validation
      pool: ${{ github.event_name == 'workflow_dispatch' && inputs.pool || 'auto' }}
      routing_enabled: ${{ vars.CI_RUNNER_ROUTING_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.pool != 'auto') }}
      native_profile: template-native
      native_label: ${{ vars.CI_RUNNER_LABEL || vars.LOCALCLUSTER_RUNNER_LABEL || 'localcluster-books' }}
      native_host: ${{ vars.CI_RUNNER_HOST }}
      desktop_profile: template-desktop
      repository_owner: ${{ github.repository_owner }}
      repository_name: ${{ github.event.repository.name }}
      app_client_id: ${{ vars.CI_RUNNER_INVENTORY_APP_CLIENT_ID }}
    secrets:
      CI_RUNNER_PROFILES_JSON: ${{ secrets.CI_RUNNER_PROFILES_JSON }}
      CI_RUNNER_INVENTORY_APP_PRIVATE_KEY: ${{ secrets.CI_RUNNER_INVENTORY_APP_PRIVATE_KEY }}
    permissions:
      contents: read

  # Keeps the native route as the default and allocates desktop work only after
  # same-repository PR validation and explicit profile selection.
  validate:
    name: validate
    needs: select-validation
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.select-validation.result == 'success' }}
    runs-on: [self-hosted, linux, x64, "${{ needs.select-validation.outputs.runner_label }}"]
    timeout-minutes: 75
    outputs:
      frontend_profile: ${{ steps.frontend_profile.outputs.profile }}
      acceptance_profile: ${{ steps.frontend_profile.outputs.acceptance_profile }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Validate quality audit runner
        run: python3 -m unittest Scripts.Quality.tests.test_run_quality_audit

      - name: Isolate registry credentials for this job
        run: |
          docker_config="$(mktemp -d "${RUNNER_TEMP}/ci-docker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")"
          chmod 0700 "$docker_config"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"

      - name: Verify legacy CI runner
        if: ${{ needs.select-validation.outputs.routing_enabled != 'true' }}
        env:
          CI_RUNNER_HOST: ${{ vars.CI_RUNNER_HOST }}
        run: |
          set -euo pipefail
          : "${CI_RUNNER_HOST:?Set the CI_RUNNER_HOST repository variable to the expected runner hostname}"
          echo "Runner name: ${RUNNER_NAME:-unknown}"
          echo "Host: $(hostname)"
          test "${RUNNER_OS:?GitHub runner OS is required}" = "Linux"
          test -d "${GITHUB_WORKSPACE:?GitHub workspace is required}"
          case "$GITHUB_WORKSPACE" in
            /mnt/*)
              echo "CI workspace must use the runner's Linux filesystem: $GITHUB_WORKSPACE" >&2
              exit 1
              ;;
          esac
          test "$(docker info --format '{{.OSType}}')" = "linux"
          test "$(hostname)" = "$CI_RUNNER_HOST"

      - name: Verify selected CI runner profile
        if: ${{ needs.select-validation.outputs.routing_enabled == 'true' }}
        env:
          CI_RUNNER_PROFILES_JSON: ${{ secrets.CI_RUNNER_PROFILES_JSON }}
          CI_PROFILE: ${{ needs.select-validation.outputs.profile }}
          CI_LABEL: ${{ needs.select-validation.outputs.runner_label }}
          CI_RUNNER_ID: ${{ needs.select-validation.outputs.runner_id }}
        run: |
          set -euo pipefail
          verify_args=(--config-json-env CI_RUNNER_PROFILES_JSON --profile "$CI_PROFILE" --label "$CI_LABEL")
          if [[ -n "$CI_RUNNER_ID" ]]; then
            verify_args+=(--runner-id "$CI_RUNNER_ID")
          fi
          python3 Scripts/CI/verify_ci_runner.py "${verify_args[@]}"

      - name: Ensure self-hosted runner prerequisites
        run: bash Deployment/Common/Scripts/ensure-actions-runner-prereqs.sh --check

      - name: Activate validated Ansible generation
        run: |
          bash Deployment/LocalCluster/Scripts/install-ansible.sh --check
          ansible_root="$(readlink -f "${HOME}/.local/share/books-ansible/current")"
          test -x "${ansible_root}/bin/ansible-playbook"
          echo "${ansible_root}/bin" >> "$GITHUB_PATH"

      - name: Validate LocalCluster Ansible playbook syntax
        run: |
          set -euo pipefail
          syntax_root="$(mktemp -d "${RUNNER_TEMP:-/tmp}/ansible_syntax.XXXXXX")"
          trap 'rm -rf -- "$syntax_root"' EXIT
          mkdir -p \
            "$syntax_root/Deployment/LocalCluster/ansible/playbooks" \
            "$syntax_root/Deployment/LocalCluster/inventory/prod" \
            "$syntax_root/Deployment/Common"
          cp Deployment/LocalCluster/ansible/playbooks/site.yml \
            "$syntax_root/Deployment/LocalCluster/ansible/playbooks/site.yml"
          cp Deployment/Common/release.yml \
            "$syntax_root/Deployment/Common/release.yml"
          printf '%s\n' '---' '{}' > \
            "$syntax_root/Deployment/LocalCluster/inventory/prod/vault.yml"
          printf '%s\n' \
            '[all]' 'localhost' '' \
            '[node_db]' 'localhost' '' \
            '[load_balancer]' 'localhost' '' \
            '[app_servers]' 'localhost' \
            > "$syntax_root/inventory.ini"
          ANSIBLE_ROLES_PATH="$GITHUB_WORKSPACE/Deployment/LocalCluster/ansible/roles:$GITHUB_WORKSPACE/Deployment/Common/ansible/roles" \
            ansible-playbook \
              --inventory "$syntax_root/inventory.ini" \
              --syntax-check \
              "$syntax_root/Deployment/LocalCluster/ansible/playbooks/site.yml"

      - name: Validate LocalSingleNode playbook syntax
        run: bash Deployment/LocalSingleNode/Scripts/validate-playbooks.sh

      - name: Test native single-node setup and maintenance fixtures
        run: python3 -m unittest discover -s Deployment/LocalSingleNode/Scripts/Tests -v

      - name: Test Caddy repository migration safeguards
        run: python3 -m unittest Deployment/Common/Scripts/Tests/test_caddy_install.py -v

      - name: Test public tunnel ownership and credential safeguards
        run: python3 -m unittest Deployment/Common/Scripts/Tests/test_cloudflare_tunnel.py -v

      - name: Test Cloud and LocalCluster settings validation parity
        run: |
          python3 -m unittest Deployment/Common/Scripts/Tests/test_settings_validation.py -v
          python3 -m unittest Deployment/Common/Scripts/Tests/test_account_deploy_settings.py -v

      # Report only. The self-hosted node's Docker daemon is shared with apps, so CI
      # must not prune it; an operator runs scoped cleanup when space is low.
      - name: Check self-hosted runner disk
        if: ${{ needs.select-validation.outputs.pool != 'desktop' }}
        run: bash Scripts/CI/check-runner-capacity.sh

      - name: Configure self-hosted tool paths
        run: |
          echo "DOTNET_INSTALL_DIR=${RUNNER_TEMP}/dotnet" >> "$GITHUB_ENV"
          echo "DOTNET_ROOT=${RUNNER_TEMP}/dotnet" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve frontend profile
        id: frontend_profile
        run: |
          set -euo pipefail
          profile="$(python3 Scripts/Frontend/resolve_frontend_profile.py)"
          acceptance_profile="$(python3 Scripts/Frontend/resolve_frontend_profile.py --override "$profile" --acceptance-profile)"
          echo "profile=${profile}" >> "$GITHUB_OUTPUT"
          echo "acceptance_profile=${acceptance_profile}" >> "$GITHUB_OUTPUT"

      - name: Test Dependabot auto-merge routing
        run: python3 -m unittest Scripts/CI/tests/test_dependabot_automerge_workflow.py -v

      - name: Test frontend profile selection and CI runner contracts
        run: python3 -m unittest Scripts/CI/tests/test_frontend_profile.py Scripts/CI/tests/test_frontend_release.py Scripts/CI/tests/test_runner_profiles.py Scripts/CI/tests/test_select_ci_runner.py Scripts/CI/tests/test_verify_ci_runner.py Scripts/CI/tests/test_ci_runner_routing_workflow.py Scripts/CI/tests/test_require_ci_results.py

      - name: Test deployed-site acceptance profile split
        run: |
          command -v pwsh
          python3 -m unittest Scripts/CI/tests/test_deployed_site_acceptance.py -v

      - name: Test required .NET test-result counts
        run: python3 -m unittest Scripts/CI/tests/test_validate_dotnet_test_results.py -v

      - name: Restore
        env:
          RESOLVED_FRONTEND_PROFILE: ${{ steps.frontend_profile.outputs.profile }}
        run: dotnet restore "-p:FrontendProfile=${RESOLVED_FRONTEND_PROFILE}"

      - name: Verify .NET formatting
        run: dotnet format --verify-no-changes --verbosity minimal --no-restore

      - name: Deployment shell lint
        run: |
          {
            find Deployment/LocalSingleNode/Scripts Deployment/LocalCluster/Scripts Deployment/Common/Scripts -type f -name '*.sh' -print0
            find Deployment/Cloud/Scripts -type f -name '*.sh' -print0
            find Deployment/Common/observability/scripts -type f -name '*.sh' -print0
            find Scripts/CI -type f -name '*.sh' -print0
          } | xargs -0 shellcheck --severity=warning

      - name: Test Cloud account environment loading
        run: bash Deployment/Cloud/Scripts/Tests/test-cloud-account-env.sh

      - name: Test LocalCluster deployment lock
        run: bash Deployment/Common/Scripts/Tests/test-with-deploy-lock.sh

      - name: Test node browser lock
        run: bash Deployment/Common/Scripts/Tests/test-with-node-browser-lock.sh

      - name: Test Ansible user-only provisioning
        run: bash Deployment/Common/Scripts/Tests/test-install-ansible-user-only.sh

      - name: Test Ansible check-only setup
        run: bash Deployment/LocalCluster/Scripts/Tests/test-install-ansible-check.sh

      - name: Test Docker smoke resource lifecycle
        run: bash Deployment/LocalCluster/Scripts/Tests/test-ci-docker-smoke.sh

      - name: Validate local Compose frontend profiles
        run: |
          set -euo pipefail
          if [[ -e .env ]]; then
            echo "CI checkout unexpectedly contains .env; refusing to replace it." >&2
            exit 1
          fi
          cp .env.example .env
          trap 'rm -f -- .env' EXIT
          for profile in BlazorAuto React; do
            case "$profile" in
              BlazorAuto) target=final-blazor ;;
              React) target=final-react ;;
              *) exit 2 ;;
            esac
            compose_config="$(FRONTEND_PROFILE_OVERRIDE="$profile" FRONTEND_DOCKER_TARGET="$target" \
              docker compose --env-file .env.example config --format json)"
            python3 -c 'import json,sys; actual=json.loads(sys.stdin.read())["services"]["web"]["build"]["target"]; expected=sys.argv[2]; actual == expected or sys.exit(f"{sys.argv[1]} Compose target is {actual!r}, expected {expected!r}")' \
              "$profile" "$target" <<< "$compose_config"
          done

      - name: Test migration staging provenance
        run: python3 -m unittest Scripts/CI/tests/test_migration_staging_artifact.py

      - name: Test release provenance and manifest contract
        run: |
          python3 -m unittest \
            Deployment/Common/Scripts/Tests/test_ci_provenance.py \
            Deployment/Common/Scripts/Tests/test_release_contract.py \
            Deployment/Common/Scripts/Tests/test_registry_payload.py \
            Deployment/Common/Scripts/Tests/test_registry_retention.py \
            Deployment/Common/Scripts/Tests/test_registry_inventory.py \
            Deployment/Common/Scripts/Tests/test_registry_inventory_cli.py \
            Deployment/Common/Scripts/Tests/test_registry_protection.py \
            Deployment/Common/Scripts/Tests/test_registry_retention_cli.py \
            Deployment/Common/Scripts/Tests/test_registry_retention_recovery.py \
            Deployment/Common/Scripts/Tests/test_registry_capacity_recovery.py \
            Deployment/Common/Scripts/Tests/test_registry_gc.py \
            Deployment/Common/Scripts/Tests/test_registry_lock_guard.py \
            Deployment/Common/Scripts/Tests/test_prune_archived_diagnostic_artifacts.py \
            Deployment/Common/Scripts/Tests/test_ci_payload_receipt.py \
            Deployment/Common/Scripts/Tests/test_pull_release_payload.py \
            Deployment/Common/Scripts/Tests/test_pin_release_payload.py \
            Deployment/Common/Scripts/Tests/test_import_legacy_release_payload.py \
            Deployment/Common/Scripts/Tests/test_release_status.py \
            Deployment/Common/Scripts/Tests/test_application_image_protection.py \
            Deployment/Common/Scripts/Tests/test_release_settings.py \
            Scripts/CI/tests/test_ci_report_store.py

      - name: Test release status snapshots
        run: |
          python3 -m unittest Deployment/LocalCluster/Scripts/Tests/test_release_status.py -v
          python3 -m unittest Deployment/LocalSingleNode/Scripts/Tests/test_release_status.py -v
          python3 -m unittest Deployment/LocalSingleNode/Scripts/Tests/test_pin_legacy_release.py -v

      - name: Test deployment target gates and CI runner profiles
        run: python3 -m unittest Deployment/Common/Scripts/Tests/test_target_gate.py

      - name: Test release identity verification
        run: bash Deployment/LocalCluster/Scripts/Tests/test-verify-release-identity.sh

      - name: Test LocalSingleNode release identity verification
        run: bash Deployment/LocalSingleNode/Scripts/Tests/test-verify-release-identity.sh

      - name: Test maintenance and cleanup safeguards
        run: |
          bash Deployment/LocalCluster/Scripts/Tests/test-localcluster-maintenance.sh
          bash Deployment/LocalCluster/Scripts/Tests/test-prune-docker-residue-low-disk.sh
          bash Deployment/Common/Scripts/Tests/test-prune-actions-runner-residue.sh
          bash Deployment/Common/Scripts/Tests/test-ensure-actions-runner-prereqs.sh
          python3 Deployment/LocalCluster/Scripts/Tests/test_prune_ci_residue.py
          python3 Deployment/LocalCluster/Scripts/Tests/test_runner_identity.py
          python3 -m unittest Deployment/LocalCluster/Scripts/Tests/test_doc_slice_loader.py -v
          python3 -m unittest Deployment/LocalCluster/Scripts/Tests/test_prepare_release_pin_root.py -v
          python3 -m unittest Deployment/LocalCluster/Scripts/Tests/test_prepare_data_protection_vault.py -v
          python3 -m unittest Deployment/LocalCluster/Scripts/Tests/test_read_live_release_ci_run_ids.py -v
          python3 -m unittest Deployment/Common/Scripts/Tests/test_prune_actions_artifacts.py

      - name: GitHub Actions workflow lint
        run: bash Scripts/CI/run-actionlint.sh

      - name: Common release settings validation
        run: bash Deployment/Common/Scripts/validate-common-release.sh

      - name: Cloud deployment settings validation
        run: bash Deployment/Cloud/Scripts/validate-cloud-settings.sh

      - name: Common observability validation
        run: bash Deployment/Common/observability/scripts/validate-observability.sh

      - name: Deployment audit
        run: bash Deployment/LocalCluster/Scripts/audit-deployment.sh

      - name: Setup Python
        run: |
          python_venv="${RUNNER_TEMP}/ci-python"
          if [ -e "$python_venv" ]; then
            rm -rf "$python_venv"
          fi
          python3 -m venv "$python_venv"
          constraints_file="${GITHUB_WORKSPACE}/Deployment/Common/ci-python-constraints.txt"
          test -r "$constraints_file"
          echo "${python_venv}/bin" >> "$GITHUB_PATH"
          {
            echo "CI_PYTHON_CONSTRAINTS=${constraints_file}"
            echo "PIP_CONSTRAINT=${constraints_file}"
            echo "PIP_DISABLE_PIP_VERSION_CHECK=1"
            echo "PIP_NO_INPUT=1"
          } >> "$GITHUB_ENV"
          "${python_venv}/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            --constraint "$constraints_file" \
            "pip==26.2.1"

      - name: Deployment template render validation
        run: |
          python -m pip install --constraint "$CI_PYTHON_CONSTRAINTS" jinja2
          bash Deployment/LocalCluster/Scripts/validate-rendered-templates.sh

      - name: Deployment YAML lint
        run: |
          python -m pip install --constraint "$CI_PYTHON_CONSTRAINTS" yamllint
          yamllint .github Deployment docker-compose.yml .yamllint.yml

      - name: Audit workflow runner, cache, artifact, and report policies
        run: |
          python3 Scripts/CI/workflow_policy.py --repo-root .
          python3 -m unittest Scripts/CI/tests/test_workflow_policy.py

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.12.0
          package-manager-cache: false

      - name: Audit .NET packages for vulnerabilities
        run: dotnet list BlazorAutoApp.sln package --vulnerable --include-transitive

      - name: Audit .NET packages for deprecations
        run: dotnet list BlazorAutoApp.sln package --deprecated

      - name: Docker preflight for integration tests
        run: |
          docker info
          docker pull postgres:18.4-alpine3.23
          docker pull redis:8.8.0-alpine3.23

      # Ryuk stays enabled as the backstop; the fixtures also dispose their
      # containers explicitly and label them with localcluster.ci.* labels.
      - name: Build and test both frontend profiles
        run: bash Deployment/Common/Scripts/with-node-browser-lock.sh bash Scripts/CI/validate-frontend-profiles.sh "$RUNNER_TEMP/test-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/validate/profiles"

      - name: Prove Testcontainers lifecycle cleanup
        env:
          RUN_TESTCONTAINER_LIFECYCLE: "1"
        run: |
          lifecycle_results="$RUNNER_TEMP/test-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/validate/lifecycle"
          mkdir -p "$lifecycle_results"
          dotnet test --configuration Release --no-build -p:FrontendProfile=React \
            --filter "FullyQualifiedName~TestContainerLifecycleTests" \
            --logger "trx;LogFileName=lifecycle.trx" --results-directory "$lifecycle_results"
          python3 Scripts/CI/validate_dotnet_test_results.py "$lifecycle_results/lifecycle.trx" \
            --expected-skipped 0 --suite "Testcontainers lifecycle"

      - name: Install frontend dependencies
        working-directory: BlazorAutoApp.Client
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: BlazorAutoApp.Client
        run: npm audit

      - name: Build Tailwind CSS
        working-directory: BlazorAutoApp.Client
        run: npm run css:build

      - name: Verify generated CSS is current
        run: git diff --exit-code -- BlazorAutoApp/wwwroot/tailwind.css BlazorAutoApp.Client/package-lock.json

      - name: Install pinned npm for React frontend
        run: |
          npm_prefix="$RUNNER_TEMP/react-npm-12.2.0"
          npm install --global --prefix "$npm_prefix" npm@12.2.0
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"

      - name: Verify pinned React toolchain
        run: |
          test "$(node --version)" = "v26.12.0"
          test "$(npm --version)" = "12.2.0"

      - name: Install React frontend dependencies
        working-directory: BlazorAutoApp.React
        run: npm ci

      - name: Audit React frontend dependencies
        working-directory: BlazorAutoApp.React
        run: npm audit

      - name: Check React OpenAPI contract
        working-directory: BlazorAutoApp.React
        run: npm run api:check

      - name: Lint React frontend
        working-directory: BlazorAutoApp.React
        run: npm run lint

      - name: Test React frontend
        working-directory: BlazorAutoApp.React
        run: |
          react_report="$RUNNER_TEMP/test-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/validate/react/react-vitest-results.json"
          mkdir -p "$(dirname "$react_report")"
          npm test -- --reporter=default --reporter=json --outputFile="$react_report"
          node - "$react_report" <<'NODE'
          const report = JSON.parse(require("node:fs").readFileSync(process.argv[2], "utf8"));
          if (report.numTotalTests === 0
              || report.numPassedTests !== report.numTotalTests
              || report.numFailedTests !== 0
              || report.numPendingTests !== 0) {
            const counts = {
              total: report.numTotalTests,
              passed: report.numPassedTests,
              failed: report.numFailedTests,
              skipped: report.numPendingTests,
            };
            console.error(`React unit tests must all pass with no skips: ${JSON.stringify(counts)}.`);
            process.exitCode = 1;
          } else {
            console.log(`React unit tests: ${report.numPassedTests} passed, no skips.`);
          }
          NODE

      - name: Build React frontend
        working-directory: BlazorAutoApp.React
        run: npm run build

      - name: React public Chromium browser regression
        run: bash Deployment/Common/Scripts/with-node-browser-lock.sh pwsh -File Scripts/Testing/RunReactPublicE2E.ps1 -Browser chromium -Suite broad -Configuration Release -ReuseFrontendBuild

      - name: Load release settings
        run: |
          app_image="$(bash Deployment/Common/Scripts/read-release-setting.sh app_image)"
          ci_image_tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "APP_IMAGE=${app_image}"
            echo "CI_IMAGE_TAG=${ci_image_tag}"
          } >> "$GITHUB_ENV"

      # PR and non-main runs validate both profile targets without pushing.
      # publish-main receives only the tracked selection from the validate job.
      - name: Build and smoke both frontend image profiles
        id: ci_smoke
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          for profile in BlazorAuto React; do
            case "$profile" in
              BlazorAuto) docker_target=final-blazor ;;
              React) docker_target=final-react ;;
              *) echo "Unsupported frontend profile: $profile" >&2; exit 2 ;;
            esac
            acceptance_profile="$(python3 Scripts/Frontend/resolve_frontend_profile.py \
              --override "$profile" --acceptance-profile)"
            image_tag="${CI_IMAGE_TAG}-${profile}"

            dotnet build BlazorAutoApp.Test/BlazorAutoApp.Test.csproj \
              --configuration Release "-p:FrontendProfile=${profile}"
            docker build \
              --pull \
              --target "$docker_target" \
              --build-arg "FRONTEND_PROFILE_OVERRIDE=${profile}" \
              --label "localcluster.ci.repository=${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label localcluster.ci.owner=ci-build \
              --label "localcluster.ci.run_id=${GITHUB_RUN_ID}" \
              --label "localcluster.ci.run_attempt=${GITHUB_RUN_ATTEMPT}" \
              -f BlazorAutoApp/Dockerfile \
              -t "${APP_IMAGE}:${image_tag}" \
              .
            FRONTEND_PROFILE="$profile" \
              FRONTEND_ACCEPTANCE_PROFILE="$acceptance_profile" \
              APP_VERSION="$image_tag" \
              bash Deployment/Common/Scripts/with-node-browser-lock.sh bash Deployment/LocalCluster/Scripts/ci-docker-smoke.sh
          done

      - name: Remove this run's smoke resources after interruption
        if: ${{ always() && steps.ci_smoke.outcome != 'skipped' && steps.ci_smoke.outcome != '' }}
        run: bash Deployment/LocalCluster/Scripts/ci-docker-smoke.sh --cleanup-only

      # Owned cleanup only: remove the exact two profile tags this run built.
      # Unscoped prunes are not allowed on the shared CI runner.
      - name: Remove this run's local Docker image
        if: ${{ always() && (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') }}
        run: |
          for profile in BlazorAuto React; do
            image_tag="${CI_IMAGE_TAG}-${profile}"
            if [ -n "${APP_IMAGE:-}" ] && docker image inspect "${APP_IMAGE}:${image_tag}" >/dev/null 2>&1; then
              docker image rm "${APP_IMAGE}:${image_tag}"
            fi
          done

      - name: Report runner capacity
        if: always()
        run: |
          df -h /opt
          df -Pi /opt
          echo "CI cleans only resources it owns; scoped maintenance handles the rest."

      - name: Store CI reports on this runner
        if: always()
        env:
          REPORT_STATUS: ${{ job.status }}
        run: |
          report_source="${RUNNER_TEMP}/test-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/validate"
          mkdir -p "$report_source"
          if [[ -e BlazorAutoApp.Test/TestResults/Playwright || -L BlazorAutoApp.Test/TestResults/Playwright ]]; then
            test ! -e "$report_source/playwright"
            test ! -L "$report_source/playwright"
            cp -a -- BlazorAutoApp.Test/TestResults/Playwright "$report_source/playwright"
          fi
          python3 Scripts/CI/ci_report_store.py save \
            --source "$report_source" \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --job validate \
            --status "$REPORT_STATUS" --step-summary "$GITHUB_STEP_SUMMARY" \
            --runner-name "${RUNNER_NAME:-$(hostname)}"

  # Publishes the release for main: the image, the migration bundle and a
  # release manifest that binds them to this commit and CI run.
  select-publication:
    name: Select fresh publication runner
    needs: validate
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.validate.result == 'success' }}
    uses: ./.github/workflows/select-ci-runner.yml
    with:
      stage: publication
      pool: auto
      routing_enabled: ${{ vars.CI_RUNNER_ROUTING_ENABLED == 'true' }}
      native_profile: template-native
      native_label: ${{ vars.CI_RUNNER_LABEL || vars.LOCALCLUSTER_RUNNER_LABEL || 'localcluster-books' }}
      native_host: ${{ vars.CI_RUNNER_HOST }}
      desktop_profile: template-desktop
      repository_owner: ${{ github.repository_owner }}
      repository_name: ${{ github.event.repository.name }}
      app_client_id: ${{ vars.CI_RUNNER_INVENTORY_APP_CLIENT_ID }}
    secrets:
      CI_RUNNER_PROFILES_JSON: ${{ secrets.CI_RUNNER_PROFILES_JSON }}
      CI_RUNNER_INVENTORY_APP_PRIVATE_KEY: ${{ secrets.CI_RUNNER_INVENTORY_APP_PRIVATE_KEY }}
    permissions:
      contents: read

  publish-main:
    name: publish-main
    needs: [validate, select-publication]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.select-publication.result == 'success' }}
    runs-on: [self-hosted, linux, x64, "${{ needs.select-publication.outputs.runner_label }}"]
    concurrency:
      group: template-registry-payloads
      queue: max
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Validate required CI results
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PUBLICATION_SELECTION_RESULT: ${{ needs.select-publication.result }}
        run: |
          set -euo pipefail
          case "${CI_EVENT_NAME}:${CI_REF}" in
            push:refs/heads/main|workflow_dispatch:refs/heads/main) ;;
            *)
              echo "Unexpected CI event/ref: ${CI_EVENT_NAME}:${CI_REF}" >&2
              exit 1
              ;;
          esac
          if [[ "$VALIDATE_RESULT" != "success" ]]; then
            echo "Main release requires validate=success, got ${VALIDATE_RESULT}" >&2
            exit 1
          fi
          if [[ "$PUBLICATION_SELECTION_RESULT" != "success" ]]; then
            echo "Main release requires a fresh publication selection, got ${PUBLICATION_SELECTION_RESULT}" >&2
            exit 1
          fi
          echo "Required main CI result passed."

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Isolate registry credentials for this job
        run: |
          docker_config="$(mktemp -d "${RUNNER_TEMP}/ci-docker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")"
          chmod 0700 "$docker_config"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"

      - name: Verify legacy CI runner
        if: ${{ needs.select-publication.outputs.routing_enabled != 'true' }}
        env:
          CI_RUNNER_HOST: ${{ vars.CI_RUNNER_HOST }}
        run: |
          set -euo pipefail
          : "${CI_RUNNER_HOST:?Set the CI_RUNNER_HOST repository variable to the expected runner hostname}"
          echo "Runner name: ${RUNNER_NAME:-unknown}"
          echo "Host: $(hostname)"
          test "${RUNNER_OS:?GitHub runner OS is required}" = "Linux"
          test -d "${GITHUB_WORKSPACE:?GitHub workspace is required}"
          case "$GITHUB_WORKSPACE" in
            /mnt/*)
              echo "CI workspace must use the runner's Linux filesystem: $GITHUB_WORKSPACE" >&2
              exit 1
              ;;
          esac
          test "$(docker info --format '{{.OSType}}')" = "linux"
          test "$(hostname)" = "$CI_RUNNER_HOST"

      - name: Verify selected CI runner profile
        if: ${{ needs.select-publication.outputs.routing_enabled == 'true' }}
        env:
          CI_RUNNER_PROFILES_JSON: ${{ secrets.CI_RUNNER_PROFILES_JSON }}
          CI_PROFILE: ${{ needs.select-publication.outputs.profile }}
          CI_LABEL: ${{ needs.select-publication.outputs.runner_label }}
          CI_RUNNER_ID: ${{ needs.select-publication.outputs.runner_id }}
        run: |
          set -euo pipefail
          verify_args=(--config-json-env CI_RUNNER_PROFILES_JSON --profile "$CI_PROFILE" --label "$CI_LABEL")
          if [[ -n "$CI_RUNNER_ID" ]]; then
            verify_args+=(--runner-id "$CI_RUNNER_ID")
          fi
          python3 Scripts/CI/verify_ci_runner.py "${verify_args[@]}"

      - name: Ensure self-hosted runner prerequisites
        run: bash Deployment/Common/Scripts/ensure-actions-runner-prereqs.sh --check

      - name: Check self-hosted runner disk
        if: ${{ needs.select-publication.outputs.pool != 'desktop' }}
        run: bash Scripts/CI/check-runner-capacity.sh

      - name: Configure self-hosted tool paths
        run: |
          echo "DOTNET_INSTALL_DIR=${RUNNER_TEMP}/dotnet" >> "$GITHUB_ENV"
          echo "DOTNET_ROOT=${RUNNER_TEMP}/dotnet" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Load release settings
        id: release_settings
        env:
          RESOLVED_FRONTEND_PROFILE: ${{ needs.validate.outputs.frontend_profile }}
          ADDITIONAL_FRONTEND_PROFILES: ${{ vars.ADDITIONAL_FRONTEND_PROFILES }}
        run: |
          set -euo pipefail
          python3 Scripts/CI/frontend_release_plan.py
          app_image="$(bash Deployment/Common/Scripts/read-release-setting.sh app_image)"
          release_payload_image="$(bash Deployment/Common/Scripts/read-release-setting.sh release_payload_image)"
          release_payload_prefix="$(bash Deployment/Common/Scripts/read-release-setting.sh release_payload_prefix)"
          migration_bundle_name="$(bash Deployment/Common/Scripts/read-release-setting.sh migration_bundle_name)"
          migration_runtime="$(bash Deployment/Common/Scripts/read-release-setting.sh migration_runtime)"
          ci_image_tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "APP_IMAGE=${app_image}"
            echo "RELEASE_PAYLOAD_IMAGE=${release_payload_image}"
            echo "RELEASE_PAYLOAD_PREFIX=${release_payload_prefix}"
            echo "CI_IMAGE_TAG=${ci_image_tag}"
            echo "MIGRATION_BUNDLE_NAME=${migration_bundle_name}"
            echo "MIGRATION_RUNTIME=${migration_runtime}"
          } >> "$GITHUB_ENV"
          {
            echo "release_payload_image=${release_payload_image}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore .NET projects for this publisher run
        env:
          RESOLVED_FRONTEND_PROFILE: ${{ needs.validate.outputs.frontend_profile }}
        run: dotnet restore BlazorAutoApp.sln "-p:FrontendProfile=${RESOLVED_FRONTEND_PROFILE}"

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build migration bundle for this exact publisher run
        run: |
          mkdir -p artifacts/migrations
          dotnet ef migrations bundle \
            --project BlazorAutoApp/BlazorAutoApp.csproj \
            --startup-project BlazorAutoApp/BlazorAutoApp.csproj \
            --configuration Release \
            --self-contained \
            --runtime "${MIGRATION_RUNTIME}" \
            --output "artifacts/migrations/${MIGRATION_BUNDLE_NAME}"

      - name: Create migration staging provenance
        env:
          RESOLVED_FRONTEND_PROFILE: ${{ needs.validate.outputs.frontend_profile }}
        run: |
          python3 Scripts/CI/migration_staging_artifact.py create \
            --directory artifacts/migrations \
            --bundle-filename "${MIGRATION_BUNDLE_NAME}" \
            --runtime "${MIGRATION_RUNTIME}" \
            --repository-root "${GITHUB_WORKSPACE}"

      - name: Validate migration staging artifact
        run: |
          python3 Scripts/CI/migration_staging_artifact.py validate \
            --directory artifacts/migrations \
            --bundle-filename "${MIGRATION_BUNDLE_NAME}" \
            --runtime "${MIGRATION_RUNTIME}"

      - name: Build browser smoke test binaries
        env:
          RESOLVED_FRONTEND_PROFILE: ${{ needs.validate.outputs.frontend_profile }}
        run: |
          dotnet build BlazorAutoApp.Test/BlazorAutoApp.Test.csproj --configuration Release "-p:FrontendProfile=${RESOLVED_FRONTEND_PROFILE}"
          test -s BlazorAutoApp.Test/bin/Release/net10.0/playwright.ps1

      - name: Enforce final GHCR payload capacity before any registry publication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIMARY_PAYLOAD_IMAGE: ${{ steps.release_settings.outputs.release_payload_image }}
          ADDITIONAL_PAYLOAD_IMAGE: ${{ steps.release_settings.outputs.additional_payload_image }}
        run: |
          set -euo pipefail
          [[ -n "$PRIMARY_PAYLOAD_IMAGE" ]] || { echo "Primary release payload package is unavailable." >&2; exit 1; }
          reserved_bytes="$(python3 - "artifacts/migrations/${MIGRATION_BUNDLE_NAME}" "$ADDITIONAL_PAYLOAD_IMAGE" <<'PY'
          import pathlib
          import sys

          bundle_bytes = pathlib.Path(sys.argv[1]).stat().st_size
          package_count = 1 + (1 if sys.argv[2] else 0)
          # Admit only the migration bundle bytes for each destination package.
          print(bundle_bytes * package_count)
          PY
          )"
          packages=(--package "${PRIMARY_PAYLOAD_IMAGE}=private")
          retained_bootstraps=(--retain-manifest "${PRIMARY_PAYLOAD_IMAGE}@sha256:25fef0757d76c56cd980dca6cde1e156ab7a2daa902306ab48da4e12a6e7343f")
          if [[ -n "$ADDITIONAL_PAYLOAD_IMAGE" ]]; then
            packages+=(--package "${ADDITIONAL_PAYLOAD_IMAGE}=private")
            retained_bootstraps+=(--retain-manifest "${ADDITIONAL_PAYLOAD_IMAGE}@sha256:25fef0757d76c56cd980dca6cde1e156ab7a2daa902306ab48da4e12a6e7343f")
          fi
          bash Deployment/Common/Scripts/with-deploy-lock.sh \
            python3 Deployment/Common/Scripts/registry-retention.py \
              "${packages[@]}" "${retained_bootstraps[@]}" --admission-kind final --reserved-bytes "$reserved_bytes"

      - name: Build Docker image
        env:
          RESOLVED_FRONTEND_PROFILE: ${{ needs.validate.outputs.frontend_profile }}
        run: |
          case "${RESOLVED_FRONTEND_PROFILE}" in
            BlazorAuto) docker_target=final-blazor ;;
            React) docker_target=final-react ;;
            *) echo "Unsupported frontend profile: ${RESOLVED_FRONTEND_PROFILE}" >&2; exit 2 ;;
          esac
          docker build \
            --pull \
            --target "${docker_target}" \
            --build-arg "FRONTEND_PROFILE_OVERRIDE=${RESOLVED_FRONTEND_PROFILE}" \
            --label "localcluster.ci.repository=${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label localcluster.ci.owner=ci-build \
            --label "localcluster.ci.run_id=${GITHUB_RUN_ID}" \
            --label "localcluster.ci.run_attempt=${GITHUB_RUN_ATTEMPT}" \
            -f BlazorAutoApp/Dockerfile \
            -t "${APP_IMAGE}:${CI_IMAGE_TAG}" \
            .

      - name: Docker smoke and browser smoke
        id: ci_smoke
        env:
          FRONTEND_PROFILE: ${{ needs.validate.outputs.frontend_profile }}
          FRONTEND_ACCEPTANCE_PROFILE: ${{ needs.validate.outputs.acceptance_profile }}
          APP_VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash Deployment/Common/Scripts/with-node-browser-lock.sh bash Deployment/LocalCluster/Scripts/ci-docker-smoke.sh

      - name: Remove this run's smoke resources after interruption
        if: ${{ always() && steps.ci_smoke.outcome != 'skipped' && steps.ci_smoke.outcome != '' }}
        run: bash Deployment/LocalCluster/Scripts/ci-docker-smoke.sh --cleanup-only

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image for release
        run: docker tag "${APP_IMAGE}:${CI_IMAGE_TAG}" "${APP_IMAGE}:${GITHUB_SHA}"

      - name: Push Docker image
        run: docker push "${APP_IMAGE}:${GITHUB_SHA}"

      - name: Resolve pushed image digest and write release manifest
        env:
          FRONTEND_PROFILE: ${{ needs.validate.outputs.frontend_profile }}
          FRONTEND_ACCEPTANCE_PROFILE: ${{ needs.validate.outputs.acceptance_profile }}
        run: |
          set -euo pipefail
          docker image inspect "${APP_IMAGE}:${GITHUB_SHA}" \
            --format '{{json .RepoDigests}}' > "${RUNNER_TEMP}/release-image-repodigests.json"
          docker image inspect "${APP_IMAGE}:${GITHUB_SHA}" \
            --format '{{json .Config.Labels}}' > "${RUNNER_TEMP}/release-image-labels.json"
          python3 Scripts/CI/write_release_manifest.py --directory artifacts/migrations \
            --digests "${RUNNER_TEMP}/release-image-repodigests.json" \
            --labels "${RUNNER_TEMP}/release-image-labels.json"

      - name: Publish additional frontend
        id: additional_release
        if: ${{ steps.release_settings.outputs.additional_profile != '' }}
        env:
          FRONTEND_PROFILE: ${{ steps.release_settings.outputs.additional_profile }}
          FRONTEND_ACCEPTANCE_PROFILE: ${{ steps.release_settings.outputs.additional_acceptance_profile }}
          APP_IMAGE: ${{ steps.release_settings.outputs.additional_image }}
        run: bash Scripts/CI/publish_additional_frontend.sh

      - name: Remove additional frontend resources after interruption
        if: ${{ always() && steps.additional_release.outcome != 'skipped' && steps.additional_release.outcome != '' }}
        env:
          APP_IMAGE: ${{ steps.release_settings.outputs.additional_image }}
          FRONTEND_PROFILE: ${{ steps.release_settings.outputs.additional_profile }}
          FRONTEND_ACCEPTANCE_PROFILE: ${{ steps.release_settings.outputs.additional_acceptance_profile }}
          APP_VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          bash Deployment/LocalCluster/Scripts/ci-docker-smoke.sh --cleanup-only
          if docker image inspect "${APP_IMAGE}:${CI_IMAGE_TAG}" >/dev/null 2>&1; then
            docker image rm "${APP_IMAGE}:${CI_IMAGE_TAG}"
          fi

      - name: Emit immutable release payload receipt
        env:
          FRONTEND_PROFILE: ${{ needs.validate.outputs.frontend_profile }}
          FRONTEND_ACCEPTANCE_PROFILE: ${{ needs.validate.outputs.acceptance_profile }}
          PRIMARY_PAYLOAD_IMAGE: ${{ steps.release_settings.outputs.release_payload_image }}
          ADDITIONAL_PROFILE: ${{ steps.release_settings.outputs.additional_profile }}
          ADDITIONAL_ACCEPTANCE_PROFILE: ${{ steps.release_settings.outputs.additional_acceptance_profile }}
          ADDITIONAL_IMAGE: ${{ steps.release_settings.outputs.additional_image }}
          ADDITIONAL_PAYLOAD_IMAGE: ${{ steps.release_settings.outputs.additional_payload_image }}
        run: |
          python3 Scripts/CI/emit_release_payload_receipt.py \
            --manifest artifacts/migrations/release-manifest.json \
            --bundle "artifacts/migrations/${MIGRATION_BUNDLE_NAME}" \
            --repository "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --commit-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --profile "${FRONTEND_PROFILE}" \
            --acceptance-profile "${FRONTEND_ACCEPTANCE_PROFILE}" \
            --runtime "${MIGRATION_RUNTIME}" \
            --app-image "${APP_IMAGE}" \
            --payload-image "${PRIMARY_PAYLOAD_IMAGE}" \
            --payload-image-prefix "${RELEASE_PAYLOAD_PREFIX}"
          if [[ -n "${ADDITIONAL_PROFILE}" ]]; then
            python3 Scripts/CI/emit_release_payload_receipt.py \
              --manifest artifacts/additional-migrations/release-manifest.json \
              --bundle "artifacts/additional-migrations/${MIGRATION_BUNDLE_NAME}" \
              --repository "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --commit-sha "${GITHUB_SHA}" \
              --run-id "${GITHUB_RUN_ID}" \
              --run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --profile "${ADDITIONAL_PROFILE}" \
              --acceptance-profile "${ADDITIONAL_ACCEPTANCE_PROFILE}" \
              --runtime "${MIGRATION_RUNTIME}" \
              --app-image "${ADDITIONAL_IMAGE}" \
              --payload-image "${ADDITIONAL_PAYLOAD_IMAGE}" \
              --payload-image-prefix "${RELEASE_PAYLOAD_PREFIX}"
          fi

      # Keep :<sha> for fast redeploys; remove only the per-run build tag.
      - name: Remove this run's build tag
        if: always()
        run: |
          if [ -n "${APP_IMAGE:-}" ] && docker image inspect "${APP_IMAGE}:${CI_IMAGE_TAG}" >/dev/null 2>&1; then
            docker image rm "${APP_IMAGE}:${CI_IMAGE_TAG}"
          fi

      - name: Report runner capacity
        if: always()
        run: |
          df -h /opt
          df -Pi /opt
          echo "CI cleans only resources it owns; scoped maintenance handles the rest."

      - name: Store CI reports on this runner
        if: always()
        env:
          REPORT_STATUS: ${{ job.status }}
        run: |
          report_source="${RUNNER_TEMP}/test-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/publish-main"
          mkdir -p "$report_source"
          if [[ -e BlazorAutoApp.Test/TestResults/Playwright || -L BlazorAutoApp.Test/TestResults/Playwright ]]; then
            test ! -e "$report_source/playwright"
            test ! -L "$report_source/playwright"
            cp -a -- BlazorAutoApp.Test/TestResults/Playwright "$report_source/playwright"
          fi
          python3 Scripts/CI/ci_report_store.py save \
            --source "$report_source" \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --job publish-main \
            --status "$REPORT_STATUS" --step-summary "$GITHUB_STEP_SUMMARY" \
            --runner-name "${RUNNER_NAME:-$(hostname)}"

  # After a dispatched CI run validates a refreshed Dependabot branch, hand the
  # exact tested commit back to the auto-merge workflow.
  notify-dependabot-automerge:
    name: Notify Dependabot auto-merge
    needs: validate
    if: ${{ needs.validate.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]' && startsWith(github.ref_name, 'dependabot/') }}
    runs-on: [self-hosted, linux, x64, "${{ vars.CI_RUNNER_LABEL || vars.LOCALCLUSTER_RUNNER_LABEL || 'localcluster-books' }}"]
    permissions:
      actions: write
    steps:
      - name: Verify CI runner
        env:
          CI_RUNNER_HOST: ${{ vars.CI_RUNNER_HOST }}
        run: |
          set -euo pipefail
          : "${CI_RUNNER_HOST:?Set the CI_RUNNER_HOST repository variable to the expected runner hostname}"
          echo "Runner name: ${RUNNER_NAME:-unknown}"
          echo "Host: $(hostname)"
          test "$(hostname)" = "$CI_RUNNER_HOST"
      - name: Verify GitHub CLI
        run: command -v gh
      - name: Dispatch auto-merge for the exact validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_RUN_HEAD_SHA: ${{ github.sha }}
          SOURCE_RUN_HEAD_BRANCH: ${{ github.ref_name }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh workflow run auto-merge-dependabot.yml --repo "$GH_REPO" --ref main \
            --field head_branch="$HEAD_BRANCH" \
            --field source_sha="$SOURCE_SHA" \
            --field source_run_id="$SOURCE_RUN_ID" \
            --field source_run_attempt="$SOURCE_RUN_ATTEMPT" \
            --field source_run_head_sha="$SOURCE_RUN_HEAD_SHA" \
            --field source_run_head_branch="$SOURCE_RUN_HEAD_BRANCH" \
            --field source_run_url="$SOURCE_RUN_URL"

  # Keeps one stable required check name and rejects skipped prerequisite jobs.
  ci-result-gate:
    name: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && 'build-test-push' || 'CI routing result' }}
    needs: [select-validation, validate, select-publication, publish-main]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: [self-hosted, linux, x64, "${{ vars.CI_RUNNER_LABEL || vars.LOCALCLUSTER_RUNNER_LABEL || 'localcluster-books' }}"]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Verify native CI result-gate runner
        env:
          CI_RUNNER_HOST: ${{ vars.CI_RUNNER_HOST }}
        run: |
          set -euo pipefail
          : "${CI_RUNNER_HOST:?Set the CI_RUNNER_HOST repository variable to the expected native runner hostname}"
          test "${RUNNER_OS:?GitHub runner OS is required}" = "Linux"
          test "$(hostname)" = "$CI_RUNNER_HOST"

      - name: Verify every event-required CI result
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_VALIDATION_SELECTION_RESULT: ${{ needs.select-validation.result }}
          CI_VALIDATION_RESULT: ${{ needs.validate.result }}
          CI_PUBLICATION_SELECTION_RESULT: ${{ needs.select-publication.result }}
          CI_PUBLICATION_RESULT: ${{ needs.publish-main.result }}
        run: python3 Scripts/CI/require_ci_results.py
