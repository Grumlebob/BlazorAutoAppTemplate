---
- name: Install Caddy repository prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - curl
      - debian-archive-keyring
      - debian-keyring
      - gnupg
    state: present
    update_cache: true

- name: Add Caddy apt key
  ansible.builtin.shell: |
    set -euo pipefail
    curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor --yes -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  args:
    executable: /bin/bash
    creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg

- name: Add Caddy apt repository
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt
    dest: /etc/apt/sources.list.d/caddy-stable.list
    mode: "0644"
    timeout: 60
  register: caddy_repository_download
  retries: 5
  delay: 10
  until: caddy_repository_download is succeeded

- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

- name: Ensure Caddy sites directory exists
  ansible.builtin.file:
    path: /etc/caddy/sites
    state: directory
    owner: root
    group: caddy
    mode: "0755"

- name: Install root Caddyfile
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../Common/caddy/Caddyfile"
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0644"
  notify: Reload caddy
