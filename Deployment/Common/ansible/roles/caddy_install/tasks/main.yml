---
- name: Retire the legacy Caddy Cloudsmith source
  ansible.builtin.script:
    cmd: "{{ role_path }}/../../../Scripts/retire-caddy-cloudsmith-source.py"
    executable: /usr/bin/python3
  register: caddy_source_retirement
  changed_when: "'Retired legacy Caddy source' in caddy_source_retirement.stdout"

- name: Require a supported Caddy package architecture
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] in caddy_package_architectures
    fail_msg: "No pinned official Caddy package for {{ ansible_facts['architecture'] }}"

- name: Download the pinned official Caddy Debian package
  ansible.builtin.get_url:
    url: "https://github.com/caddyserver/caddy/releases/download/v{{ caddy_package_version }}/caddy_{{ caddy_package_version }}_linux_{{ caddy_package_architectures[ansible_facts['architecture']] }}.deb"
    dest: "/var/cache/apt/archives/caddy_{{ caddy_package_version }}_linux_{{ caddy_package_architectures[ansible_facts['architecture']] }}.deb"
    checksum: "sha256:{{ caddy_package_sha256[caddy_package_architectures[ansible_facts['architecture']]] }}"
    owner: root
    group: root
    mode: "0644"
    timeout: 60
  register: caddy_package_download
  retries: 5
  delay: 10
  until: caddy_package_download is succeeded

- name: Install the verified Caddy package and its systemd service
  ansible.builtin.apt:
    deb: "{{ caddy_package_download.dest }}"
    state: present

- name: Ensure Caddy sites directory exists
  ansible.builtin.file:
    path: /etc/caddy/sites
    state: directory
    owner: root
    group: caddy
    mode: "0755"

- name: Install root Caddyfile
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../Common/caddy/Caddyfile"
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0644"
  notify: Reload caddy
