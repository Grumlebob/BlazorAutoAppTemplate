---
- name: Apply app firewall rules
  hosts: all
  become: true
  vars_files:
    - ../../../Common/release.yml
  roles:
    - firewall

- name: Ensure Docker runtime on LocalCluster observability backend
  hosts: load_balancer
  become: true
  vars_files:
    - ../../../Common/release.yml
  roles:
    - role: docker
      when: observability_enabled | default(false) | bool

- name: Deploy LocalCluster observability backend
  hosts: load_balancer
  become: true
  vars_files:
    - ../../../Common/release.yml
  roles:
    - role: observability_backend
      when: observability_enabled | default(false) | bool

- name: Deploy LocalCluster observability agents
  hosts: all
  become: true
  vars_files:
    - ../../../Common/release.yml
    - ../../inventory/prod/vault.yml
  roles:
    - role: observability_agent
      when: observability_enabled | default(false) | bool

- name: Stage the exact app image before any app interruption
  hosts: app_servers
  serial: 1
  any_errors_fatal: true
  become: true
  vars_files:
    - ../../../Common/release.yml
    - ../../inventory/prod/vault.yml
  vars:
    staged_app_image_ref: "{{ app_image ~ '@' ~ release_image_digest if release_image_digest | default('') | length > 0 else app_image ~ ':' ~ app_version }}"
  tasks:
    - name: Require supported frontend and release metadata before staging
      ansible.builtin.assert:
        that:
          - app_version is match('^[0-9a-f]{40}$')
          - release_source_sha == app_version
          - release_manifest_schema_version | string in ['1', '2']
          - release_frontend_profile in ['BlazorAuto', 'React']
          - (release_frontend_profile == 'BlazorAuto' and release_acceptance_profile == 'BlazorAutoV1') or (release_frontend_profile == 'React' and release_acceptance_profile == 'ReactPublicV1')
          - (release_manifest_schema_version | string != '1') or (release_frontend_profile == 'BlazorAuto' and release_acceptance_profile == 'BlazorAutoV1')
          - source_repo_url is match('^https://github.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
          - release_ci_run_id is not defined or release_ci_run_id | string is match('^[0-9]+$')
          - release_ci_run_attempt is not defined or release_ci_run_attempt | string is match('^[1-9][0-9]*$')
          - (release_manifest_schema_version | string != '1') or (release_ci_run_id is defined and release_ci_run_attempt is defined)
    - name: Pull exact app image before app stop
      ansible.builtin.shell: |
        set -eu
        docker_config="$(mktemp -d /tmp/{{ app_name }}-ghcr.XXXXXX)"
        trap 'rm -rf -- "$docker_config"' EXIT
        export DOCKER_CONFIG="$docker_config"
        {% if vault_ghcr_token | default('') | length > 0 %}
        echo "{{ vault_ghcr_token }}" | docker login ghcr.io -u "{{ vault_ghcr_username }}" --password-stdin
        {% endif %}
        docker pull "{{ staged_app_image_ref }}"
      args:
        executable: /bin/bash
      no_log: true
      become_user: deploy
      register: staged_app_image
      retries: 5
      delay: 15
      until: staged_app_image.rc == 0
      changed_when: false
      when: (release_payload_transport | default('ghcr-container')) != 'local-pin'

    - name: Inspect staged app image
      ansible.builtin.command: docker image inspect "{{ staged_app_image_ref }}"
      register: staged_app_image_inspect
      become_user: deploy
      changed_when: false

    - name: Require the registry digest on the staged image
      ansible.builtin.assert:
        that:
          - (release_image_digest | default('') | length == 0)
            or (release_image_digest in ((staged_app_image_inspect.stdout | from_json)[0].RepoDigests | default([]) | join(' ')))
        fail_msg: "The staged app image does not expose the expected registry digest."
    - name: Record the staged image's baked labels
      ansible.builtin.set_fact:
        staged_app_image_labels: "{{ (staged_app_image_inspect.stdout | from_json)[0].Config.Labels | default({}) }}"
      changed_when: false
    - name: Require staged release identity before app interruption or migration
      ansible.builtin.assert:
        that:
          - staged_app_image_labels.get('org.opencontainers.image.source') == source_repo_url
          - staged_app_image_labels.get('localcluster.ci.repository') == (source_repo_url | regex_replace('^https://github.com/', ''))
          - release_ci_run_id is not defined or staged_app_image_labels.get('localcluster.ci.run_id') == (release_ci_run_id | string)
          - release_ci_run_attempt is not defined or staged_app_image_labels.get('localcluster.ci.run_attempt') == (release_ci_run_attempt | string)
          - >-
            (release_manifest_schema_version | string == '1'
            and release_frontend_profile == 'BlazorAuto'
            and release_acceptance_profile == 'BlazorAutoV1'
            and staged_app_image_labels.get('org.opencontainers.image.revision', release_source_sha) == release_source_sha
            and staged_app_image_labels.get('com.blazorautoapp.frontend-profile', 'BlazorAuto') == 'BlazorAuto'
            and staged_app_image_labels.get('com.blazorautoapp.acceptance-profile', 'BlazorAutoV1') == 'BlazorAutoV1')
            or
            (release_manifest_schema_version | string == '2'
            and staged_app_image_labels.get('org.opencontainers.image.revision') == release_source_sha
            and staged_app_image_labels.get('com.blazorautoapp.frontend-profile') == release_frontend_profile
            and staged_app_image_labels.get('com.blazorautoapp.acceptance-profile') == release_acceptance_profile)
        fail_msg: "The staged image identity does not match the source SHA and frontend/acceptance contract."

- name: Stop app containers before migration
  hosts: app_servers
  become: true
  vars_files:
    - ../../../Common/release.yml
  tasks:
    - name: Check for existing app compose file
      ansible.builtin.stat:
        path: "{{ deploy_root }}/docker-compose.yml"
      register: site_app_compose_file

    - name: Stop existing app stack
      ansible.builtin.command: docker compose down
      args:
        chdir: "{{ deploy_root }}"
      become: true
      become_user: deploy
      register: site_app_stack_down
      changed_when: >-
        site_app_stack_down.rc == 0
        and ((site_app_stack_down.stdout ~ site_app_stack_down.stderr)
        is search("(?i)(removed|stopped)"))
      when:
        - run_migrations | default(false) | bool
        - site_app_compose_file.stat.exists

- name: Deploy PostgreSQL and Redis
  hosts: node_db
  become: true
  vars_files:
    - ../../../Common/release.yml
    - ../../inventory/prod/vault.yml
  roles:
    - postgres
    - redis

- name: Run database migrations once
  hosts: node_db
  become: true
  vars_files:
    - ../../../Common/release.yml
    - ../../inventory/prod/vault.yml
  tasks:
    - name: Require local migration bundle when migrations are enabled
      ansible.builtin.assert:
        that:
          - migration_bundle_local_path is defined
          - migration_bundle_local_path | length > 0
        fail_msg: "Pass -e run_migrations=true -e migration_bundle_local_path=<local path to migration bundle>."
      when: run_migrations | default(false) | bool

    - name: Ensure migration directory exists
      ansible.builtin.file:
        path: "{{ deploy_root }}/migrations"
        state: directory
        owner: deploy
        group: deploy
        mode: "0750"
      when: run_migrations | default(false) | bool

    - name: Copy migration bundle
      ansible.builtin.copy:
        src: "{{ migration_bundle_local_path }}"
        dest: "{{ deploy_root }}/migrations/{{ migration_bundle_name }}"
        owner: deploy
        group: deploy
        mode: "0750"
      when: run_migrations | default(false) | bool

    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: "{{ deploy_root }}/backups"
        state: directory
        owner: deploy
        group: deploy
        mode: "0750"
      when: run_migrations | default(false) | bool

    - name: Create pre-migration database backup
      ansible.builtin.command: ./backup-db.sh
      args:
        chdir: "{{ deploy_root }}"
      become: true
      become_user: deploy
      when: run_migrations | default(false) | bool

    - name: Run migration bundle
      ansible.builtin.shell: |
        set -euo pipefail
        cd {{ deploy_root }}
        set -a
        . ./.env
        set +a
        ./migrations/{{ migration_bundle_name }} --connection "Host=localhost;Port=$POSTGRES_PORT;Database=$POSTGRES_DB;Username=$POSTGRES_USER;Password=$POSTGRES_PASSWORD"
      args:
        executable: /bin/bash
      become: true
      become_user: deploy
      when: run_migrations | default(false) | bool

# One node at a time: the role waits for /health/ready before the next node
# starts, so a deploy without migrations keeps one node serving.
- name: Deploy app servers
  hosts: app_servers
  serial: 1
  any_errors_fatal: true
  become: true
  vars_files:
    - ../../../Common/release.yml
    - ../../inventory/prod/vault.yml
  roles:
    - app

- name: Deploy Caddy and Cloudflare Tunnel after app readiness
  hosts: load_balancer
  become: true
  vars_files:
    - ../../../Common/release.yml
    - ../../inventory/prod/vault.yml
  roles:
    - caddy
    - cloudflared

- name: Write LocalCluster app ownership markers
  hosts: all
  become: true
  vars_files:
    - ../../../Common/release.yml
  roles:
    - app_marker

- name: Publish LocalCluster release identity for local pin recovery
  hosts: app_servers
  become: true
  vars_files:
    - ../../../Common/release.yml
  tasks:
    - name: Require recoverable payload pin identity when using GHCR
      ansible.builtin.assert:
        that:
          - (release_payload_transport | default('actions-artifact')) in ['actions-artifact', 'ghcr-container', 'local-pin']
          - (release_payload_pin_key | default('')) is match('^$|^ghcr-[0-9a-f]{64}-[0-9a-f]{64}$')
          - (release_payload_transport | default('actions-artifact')) not in ['ghcr-container', 'local-pin'] or (release_payload_pin_key | default('')) is match('^ghcr-[0-9a-f]{64}-[0-9a-f]{64}$')
        fail_msg: "GHCR and local-pin releases require their exact immutable local pin key."
    - name: Ensure release recovery marker directory exists
      ansible.builtin.file:
        path: "{{ deploy_root }}/release-state"
        state: directory
        owner: deploy
        group: deploy
        mode: "0750"
    - name: Inspect current release marker before rotating it
      ansible.builtin.stat:
        path: "{{ deploy_root }}/release.json"
        follow: false
      register: current_release_marker
    - name: Inspect prior recovery marker before replacing it
      ansible.builtin.stat:
        path: "{{ deploy_root }}/release-state/previous.json"
        follow: false
      register: previous_release_marker_path
    - name: Refuse symlinked release marker paths
      ansible.builtin.assert:
        that:
          - not current_release_marker.stat.islnk | default(false)
          - not previous_release_marker_path.stat.islnk | default(false)
    - name: Read existing release marker before rotating it
      ansible.builtin.slurp:
        src: "{{ deploy_root }}/release.json"
      register: current_release_marker_content
      when: current_release_marker.stat.exists | default(false)
    - name: Require existing release marker to belong to this repository
      ansible.builtin.assert:
        that:
          - (current_release_marker_content.content | b64decode | from_json).source_repo_url | default('') == source_repo_url
      when: current_release_marker.stat.exists | default(false)
    - name: Preserve prior release identity as the recovery marker
      ansible.builtin.copy:
        src: "{{ deploy_root }}/release.json"
        dest: "{{ deploy_root }}/release-state/previous.json"
        remote_src: true
        owner: deploy
        group: deploy
        mode: "0640"
      when: current_release_marker.stat.exists | default(false)
    - name: Publish release identity for local pin retention
      ansible.builtin.copy:
        content: "{{ {'sha': app_version, 'source_sha': release_source_sha, 'image': app_image, 'digest': release_image_digest, 'frontend_profile': release_frontend_profile, 'acceptance_profile': release_acceptance_profile, 'manifest_schema_version': release_manifest_schema_version | int, 'ci_run_id': release_ci_run_id | string, 'ci_run_attempt': release_ci_run_attempt | string, 'source_repo_url': source_repo_url, 'payload_transport': release_payload_transport | default('actions-artifact'), 'release_payload_pin_key': release_payload_pin_key | default('')} | to_nice_json }}"
        dest: "{{ deploy_root }}/release.json"
        owner: deploy
        group: deploy
        mode: "0640"
