---
- name: Render app Caddy site
  ansible.builtin.template:
    src: app.caddy.j2
    dest: "/etc/caddy/sites/{{ app_name }}.caddy"
    owner: root
    group: caddy
    mode: "0644"
  notify: Reload caddy

- name: Validate Caddy configuration
  ansible.builtin.command: caddy validate --config /etc/caddy/Caddyfile
  changed_when: false

- name: Enable Caddy
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started

- name: Reload Caddy with validated configuration
  ansible.builtin.systemd:
    name: caddy
    state: reloaded
  changed_when: false
