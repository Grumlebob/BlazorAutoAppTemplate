all:
  vars:
    ansible_user: deploy
    ansible_ssh_private_key_file: ~/.ssh/books_deploy
    ansible_python_interpreter: /usr/bin/python3

  children:
    load_balancer:
      hosts:
        node-main:
          ansible_host: 192.168.0.52

    app_servers:
      hosts:
        node-app1:
          ansible_host: 192.168.0.7
        node-app2:
          ansible_host: 192.168.0.59

    node_db:
      hosts:
        node-db:
          ansible_host: 192.168.0.24
